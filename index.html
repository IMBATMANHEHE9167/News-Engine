<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" id="themeColor" content="#E6E6E6">
<script>
// Decide the theme before first paint: the saved choice, else the device setting.
(function(){var t;try{t=localStorage.getItem('vidraksh-theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;})();
</script>
<title>विद्रक्ष · Live · Pune</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E6E6E6'/%3E%3Crect x='8' y='15' width='16' height='2' fill='%239C5A2B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Tiro+Devanagari+Marathi&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --paper:#E6E6E6; --raised:#EFEFEF; --ink:#181818; --ink-2:#4A4A4A; --ink-3:#7C7C7C; --rule:#CFCFCF;
  --copper:#9C5A2B; --copper-text:#8A4D22; --copper-wash:rgba(156,90,43,.14);
  --sans:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader","Tiro Devanagari Marathi",Georgia,serif;
}
:root[data-theme="dark"]{
  --paper:#131313; --raised:#1B1B1B; --ink:#ECECEC; --ink-2:#B4B4B4; --ink-3:#808080; --rule:#2E2E2E;
  --copper:#C98652; --copper-text:#D2925F; --copper-wash:rgba(201,134,82,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* Masthead */
.mast{position:relative;text-align:center;padding:30px 20px 18px}
.switch{position:absolute;top:16px;right:18px;appearance:none;background:none;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.switch i{display:block;position:relative;width:30px;height:16px;border:1px solid var(--ink-3);border-radius:8px;transition:border-color .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-3);transition:transform .2s,background .2s}
:root[data-theme="dark"] .switch i{border-color:var(--copper)}
:root[data-theme="dark"] .switch i::after{transform:translateX(14px);background:var(--copper)}
.switch:focus-visible{outline:1px solid var(--copper);outline-offset:2px}
.mark{font-size:38px;font-weight:500;line-height:1.15;letter-spacing:.01em;margin:0}
.mark span{color:var(--copper)}
.mast hr{width:38px;height:1px;border:0;background:var(--copper);margin:9px auto 11px}
.kicker{font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2);padding-left:.32em}
#stamp{font-size:13px;color:var(--ink-3);margin-top:7px}

/* Tabs */
nav{position:sticky;top:0;z-index:1000;background:var(--paper);border-bottom:1px solid var(--rule)}
nav div{display:flex;justify-content:center;gap:34px}
nav button{appearance:none;background:none;border:0;padding:13px 0 11px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent;margin-bottom:-1px;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--copper)}
nav .period{gap:22px;border-top:1px solid var(--rule)}
nav .period button{padding:8px 0 7px;font-size:13.5px;font-weight:400;letter-spacing:.01em;text-transform:none}
nav .views{overflow-x:auto;scrollbar-width:none;justify-content:flex-start;padding:0 20px}
nav .views::-webkit-scrollbar{display:none}
nav .views button{flex:none;white-space:nowrap}
nav .views button:first-child{margin-left:auto}
nav .views button:last-child{margin-right:auto}

.label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}

/* News */
.filter{display:flex;gap:20px;overflow-x:auto;padding:16px 0 12px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;appearance:none;background:none;border:0;padding:0 0 3px;font-size:14px;color:var(--ink-3);border-bottom:1px solid transparent;white-space:nowrap;cursor:pointer}
.filter button.on{color:var(--ink);border-bottom-color:var(--copper)}
.day{display:flex;align-items:center;gap:12px;margin:26px 0 2px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.item{padding:15px 0 16px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cat{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--copper-text)}
.cat.fu{color:var(--ink-3)}
.when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.head{display:block;font-family:var(--serif);font-size:20px;line-height:1.28;font-weight:400;text-decoration:none;margin:5px 0 6px;text-wrap:pretty}
.head:hover{text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:3px;text-decoration-thickness:1px}
.by{font-size:13px;color:var(--ink-3)}
.by b{font-weight:500;color:var(--ink-2)}
.by a{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.by .chk{color:var(--copper-text);font-style:italic}
.sum{margin:0 0 6px;font-size:14px;line-height:1.4;color:var(--ink-2)}
.more{display:block;margin:22px auto 0;appearance:none;background:none;border:1px solid var(--rule);padding:9px 22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.empty{padding:44px 0;text-align:center;color:var(--ink-3);font-family:var(--serif);font-size:17px}
/* Analytics: findings / graphs */
.anmode{display:flex;justify-content:center;gap:0;margin:18px auto 0;max-width:680px;padding:0 20px}
.anmode button{appearance:none;background:none;border:1px solid var(--rule);padding:7px 22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);cursor:pointer}
.anmode button+button{border-left:0}
.anmode button.on{color:var(--ink);border-color:var(--copper);background:var(--copper-wash)}
.gwide{max-width:1000px;margin:0 auto;padding:0 20px}
.gbar{display:flex;gap:20px;overflow-x:auto;scrollbar-width:none;padding:18px 0 10px;border-bottom:1px solid var(--rule);justify-content:center}
.gbar::-webkit-scrollbar{display:none}
.gbar button{flex:none;appearance:none;background:none;border:0;padding:0 0 3px;font-size:14px;color:var(--ink-3);border-bottom:1px solid transparent;white-space:nowrap;cursor:pointer}
.gbar button.on{color:var(--ink);border-bottom-color:var(--copper)}
.gctl{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;padding:12px 0 0}
.gctl label:first-child{min-width:220px}
.gabout{margin:10px 0 6px;max-width:760px}
.gbox{padding:6px 0 0;overflow-x:auto}
@media (max-width:720px){.gbox .gsvg{min-width:680px}.gbar{justify-content:flex-start}}
.gscroll{overflow-x:auto}
.gsvg{width:100%;height:auto;display:block;overflow:visible}
.gfill{fill:var(--copper)}
.gcell,.gday,.gbarw,.gh{cursor:pointer}
.gcell:hover,.gday:hover,.gbarw:hover,.gh:hover{stroke:var(--ink);stroke-width:1.2}
.gtx{fill:var(--ink-2);font:12.5px var(--sans)}
.gsm{font-size:11px;fill:var(--ink-3)}
.gnum{fill:var(--ink);font-weight:600}
.grule{stroke:var(--rule);stroke-width:1}
.grest{fill:var(--rule);opacity:.45}
.gline{fill:none;stroke:var(--copper);stroke-width:2.2}
.gfest{stroke:var(--copper);stroke-width:3}
.gedge{stroke:var(--ink-3);opacity:.35}
.gedge.hot{stroke:var(--copper);opacity:1}
.gnode{cursor:pointer}
.gnode:hover circle{stroke:var(--ink);stroke-width:1.5}
.gtip{position:fixed;z-index:3000;display:none;pointer-events:none;background:var(--paper);color:var(--ink);border:1px solid var(--copper);padding:5px 8px;font:12.5px var(--sans);max-width:280px}
.how{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.ev{margin-top:8px}
.ev details summary{cursor:pointer;margin-top:6px;list-style:none}
.ev details summary::-webkit-details-marker{display:none}
nav > div:first-child{overflow-x:auto;scrollbar-width:none;padding:0 20px}
nav > div:first-child::-webkit-scrollbar{display:none}
nav > div:first-child button{flex:none;white-space:nowrap}
@media (max-width:720px){nav > div:first-child{justify-content:flex-start;gap:24px}}
.search{width:100%;margin:18px 0 0;padding:9px 0 8px;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--ink);font:16px var(--sans);outline:0;border-radius:0}
.search:focus{border-bottom-color:var(--copper)}
.acc{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ocwide{max-width:1180px;margin:0 auto;padding:0 20px}
.ocsearch{position:relative;max-width:680px;margin:0 auto}
.sug{position:absolute;left:0;right:0;top:100%;z-index:1500;background:var(--paper);border:1px solid var(--rule);border-top:0;max-height:360px;overflow-y:auto}
.sug .sh{padding:9px 12px 3px}
.sug button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;appearance:none;background:none;border:0;padding:7px 12px;text-align:left;cursor:pointer;font-size:14.5px;color:var(--ink)}
.sug button span:last-child{font-size:12px;color:var(--ink-3);white-space:nowrap}
.sug button.on,.sug button:hover{background:var(--copper-wash)}
.ocgraph .gsvg{max-width:760px;margin:0 auto}
.gnode.dim{opacity:.18}
.gedge.dim{opacity:.08}
.gnode.sel circle{stroke:var(--ink);stroke-width:2}
#ocBody .item:first-child{padding-top:18px}
@media (min-width:960px){
  .ocgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:44px;align-items:start}
  .ocgraph{position:sticky;top:120px}
}
.ocname{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:8px 0 6px}
.spark{display:flex;align-items:flex-end;gap:2px;height:48px}
.spark i{flex:1;background:var(--copper);opacity:.7;min-width:3px}
.scanline{text-align:right;padding:5px 20px 6px;font-size:12px;line-height:1.45;color:var(--ink-3);border-top:1px solid var(--rule)}
.scanline b{font-weight:500;color:var(--ink-2)}
.scanline .late{color:var(--copper-text)}

/* Map */
.mapgrid{max-width:1180px;margin:0 auto;padding:0 20px}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 0 8px}
.controls label{display:block}
select{width:100%;appearance:none;background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:5px 16px 6px 0;font-size:14.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select:focus{outline:0;border-bottom-color:var(--copper)}
option{background:var(--paper);color:var(--ink)}
.tog{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:6px 0 12px;cursor:pointer}
.tog input{accent-color:var(--copper);margin:0}
#map{height:50vh;min-height:320px;background:var(--raised);border:1px solid var(--rule);z-index:1}
.count{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.count b{font-weight:600;color:var(--ink)}
.sec{padding:22px 0 4px;border-top:1px solid var(--rule);margin-top:22px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:6px 0 12px}
.sec h3{margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr;gap:20px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 30px;column-gap:10px;align-items:baseline;font-size:14px;padding:5px 0 0}
.row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.row .track{grid-column:1/-1;height:2px;background:var(--rule);margin-top:4px}
.row .track i{display:block;height:2px;background:var(--copper)}
.say{font-family:var(--serif);font-size:17.5px;line-height:1.38;margin:0 0 10px;text-wrap:pretty}
.say b{font-weight:500}
.say em{font-style:normal;color:var(--copper-text)}
.note{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.mini{font-size:13.5px;color:var(--ink-2);padding:7px 0;border-top:1px solid var(--rule)}
.mini a{text-decoration:none;color:var(--ink)}
.mini a:hover{text-decoration:underline;text-decoration-color:var(--copper)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--rule);font-weight:400}
th{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
td:first-child,th:first-child{text-align:left;padding-left:0}
td.hi{color:var(--copper-text);font-weight:600}
td.z{color:var(--rule)}
.src{font-size:13.5px;color:var(--ink-2);padding:5px 0;display:flex;justify-content:space-between;gap:12px}
.src span:last-child{color:var(--ink-3);text-align:right}
.src.off span:first-child{color:var(--ink-3);text-decoration:line-through}
.hide{display:none}
footer{max-width:680px;margin:40px auto 0;padding:18px 20px 48px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);text-align:center}

/* Leaflet, restrained */
.leaflet-container{font-family:var(--sans);background:var(--raised)}
.leaflet-bar{border:1px solid var(--rule)!important;box-shadow:none!important;border-radius:0!important}
.leaflet-bar a{background:var(--paper)!important;color:var(--ink)!important;border-bottom:1px solid var(--rule)!important;border-radius:0!important;width:30px!important;height:30px!important;line-height:28px!important;font-weight:400}
.leaflet-control-attribution{background:color-mix(in srgb,var(--paper) 80%,transparent)!important;color:var(--ink-3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.lbl{background:none!important;border:0!important;box-shadow:none!important;color:var(--ink)!important;font:600 12px var(--sans);padding:0!important}
.lbl::before{display:none!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--paper)!important;color:var(--ink)!important;border:1px solid var(--rule);border-radius:0!important;box-shadow:none!important}
.leaflet-popup-content{margin:10px 12px!important;font:14px/1.35 var(--sans);max-width:240px}
.leaflet-popup-content a{color:var(--ink);font-family:var(--serif);font-size:15.5px;text-decoration:none}
.leaflet-container a.leaflet-popup-close-button{color:var(--ink-3)!important}

@media (min-width:960px){
  .mast{padding-top:40px}
  .mark{font-size:46px}
  .mapgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:start}
  .mapcol{position:sticky;top:92px}
  #map{height:calc(100vh - 225px)}
  .sidecol .sec:first-child{border-top:0;margin-top:0;padding-top:16px}
}
</style>
</head>
<body>
<header class="mast">
  <button class="switch" id="themeSwitch" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span id="themeWord">Light</span><i></i></button>
  <h1 class="mark" lang="mr" aria-label="Vidraksh">विद्र<span>क्ष</span></h1>
  <hr>
  <div class="kicker">Live · Pune</div>
  <div id="stamp">Loading</div>
</header>

<nav><div>
  <button id="tabNews" class="on">Reports</button>
  <button id="tabMap">Map &amp; patterns</button>
  <button id="tabSit">Situations</button>
  <button id="tabOc">Organised crime</button>
  <button id="tabAn">Analytics</button>
</div><div class="period views" id="views" role="group" aria-label="Area"></div><div class="period" id="period" role="group" aria-label="Period"></div><p class="scanline" id="scanLine" aria-live="polite"></p></nav>

<main id="news" class="wrap">
  <div class="filter" id="newsFilter"></div>
  <div id="newsList"></div>
</main>

<main id="mapv" class="hide">
  <div class="mapgrid">
    <div class="mapcol">
      <div class="controls">
        <label><span class="label">Type</span><select id="fCat"></select></label>
        <label><span class="label">Time</span>
          <select id="fTime"><option value="">Any time</option><option value="dark">After dark</option><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening</option><option value="night">Night</option></select></label>
      </div>
      <div id="map"></div>
      <p class="count" id="count"></p>
    </div>
    <div class="sidecol">
      <div id="areaBox"></div>
      <div id="patterns"></div>
      <section class="sec"><h3 class="label">Sources</h3><div id="sources"></div></section>
    </div>
  </div>
</main>

<main id="anv" class="hide">
  <div class="anmode" id="anMode"><button data-anm="findings" class="on">Findings</button><button data-anm="graphs">Graphs</button></div>
  <div id="anBody"></div>
</main>

<main id="ocv" class="hide">
  <div class="ocwide">
    <div class="ocsearch">
      <input id="ocQ" class="search" type="search" placeholder="Search a gang, or a word like koyta, MCOCA, extortion" autocomplete="off"
        role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ocSug">
      <div id="ocSug" class="sug hide" role="listbox"></div>
    </div>
    <p class="note" id="ocNote" style="margin:10px auto 0;max-width:680px;text-align:center"></p>
    <div class="ocgrid">
      <section class="ocgraph"><h3 class="label" style="margin:22px 0 4px">Gang links</h3><div id="ocGraph"></div></section>
      <div id="ocBody"></div>
    </div>
  </div>
</main>

<main id="sitv" class="wrap hide">
  <p class="note" id="sitIntro" style="margin:16px 0 0"></p>
  <div id="sitList"></div>
</main>

<div id="gTip" class="gtip"></div>
<footer>
  Compiled from public news reports; every headline links to its publisher. Areas and types are read from the report by rule, so a few will be wrong.
  This reflects what the press reported, not all crime.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script type="module">
// Everything is worked out by the collector (collector/engine.py); the page only reads and draws it.
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const bust = '?t=' + Date.now();
const j = async u => { const r = await fetch(u + bust, { cache: 'no-store' }); if (!r.ok) throw 0; return r.json(); };
const META = await j('data/meta.json').catch(() => ({ areas: [], cats: [], feeds: [] }));
const AREAS = META.areas, CATS = META.cats;
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const SRC = Object.fromEntries(META.feeds.map(f => [f.id, f.name]));
const BANDS = ['morning', 'afternoon', 'evening', 'night'];
const BAND_NAME = { morning: 'Morning · 6am–12', afternoon: 'Afternoon · 12–5pm', evening: 'Evening · 5–9pm', night: 'Night · 9pm–6am' };
const isDarkTheme = () => document.documentElement.dataset.theme === 'dark';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const IST = 19800000;
const istDay = d => new Date(new Date(d).getTime() + IST).toISOString().slice(0, 10);
const fmtDay = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
const ago = d => { const m = (Date.now() - new Date(d)) / 60000; return m < 60 ? Math.max(1, m | 0) + ' min ago' : m < 1440 ? (m / 60 | 0) + ' h ago' : fmtDay(d); };
const isDark = e => e.h != null ? (e.h >= 19 || e.h < 6) : e.b === 'night';
const link = (r, text) => `<a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${text}</a>`;

let STATUS = null, EVENTS = [], INCIDENTS = [];

async function load() {
  // EVENTS: reports joined into incidents, newest report first (the Reports tab). INCIDENTS: without follow-ups
  // that could not be tied to an incident; only these are counted and mapped.
  try { EVENTS = await j('data/events.json'); } catch { EVENTS = []; }
  try { STATUS = await j('data/status.json'); } catch { STATUS = null; }
  try { SITS = await j('data/situations.json'); } catch { SITS = []; }
  try { SITSTATUS = await j('data/sitstatus.json'); } catch { SITSTATUS = null; }
  try { OC = await j('data/groups.json'); } catch { OC = null; }
  try { INS = await j('data/insights.json'); } catch { INS = null; }
  EVENTS = EVENTS.filter(e => CAT[e.c]);
  INCIDENTS = EVENTS.filter(e => !e.orphan);
  const nReports = EVENTS.reduce((n, e) => n + e.reports.length, 0);
  const first = EVENTS.reduce((m, e) => e.reports.reduce((m2, r) => (r.d < m2 ? r.d : m2), m), '9999');
  $('stamp').textContent = EVENTS.length
    ? `${INCIDENTS.length} incidents from ${nReports} reports, since ${fmtDay(first)}` + (STATUS ? ` · checked ${ago(STATUS.updated)}` : '')
    : 'Nothing collected yet. The collector runs every hour.';
  drawNews(); drawSources(); drawScan();
}

/* ---------- Views ---------- */
// Pune City is the main view and opens first. Hinjewadi is part of Pimpri-Chinchwad (its police) and also has its own view.
// Reports with no area stated appear only under All.
const VIEWS = [['city', 'Pune City'], ['pcmc', 'Pimpri-Chinchwad'], ['hinj', 'Hinjewadi'], ['rural', 'Pune Rural'], ['all', 'All']];
const regionOf = id => (id === 'hinjewadi' ? 'hinj' : AREA[id].r);
const areaInView = id => view === 'all' || (view === 'pcmc' ? AREA[id].r === 'pcmc' : regionOf(id) === view);
const inView = e => view === 'all' || (!!e.a && areaInView(e.a));
let view = 'city';
function drawViews() {
  $('views').innerHTML = VIEWS.map(([v, name]) => `<button class="${v === view ? 'on' : ''}" data-v="${v}" aria-pressed="${v === view}">${name}</button>`).join('');
}
$('views').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  view = b.dataset.v; picked = null; newsN = 60; drawViews(); drawNews(); if (!$('sitv').classList.contains('hide')) drawSits(); if (!$('ocv').classList.contains('hide')) drawOc(); if (!$('anv').classList.contains('hide')) drawAn();
  if (!$('mapv').classList.contains('hide')) { fitView(); drawMap(); }
};
function fitView() {
  if (!MAP) return;
  const pts = AREAS.filter(a => areaInView(a.id)).map(a => [a.lat, a.lon]);
  if (pts.length === 1) MAP.setView(pts[0], 13); else MAP.fitBounds(L.latLngBounds(pts), { padding: [24, 24], maxZoom: 13 });
}

/* ---------- Reports ---------- */
// One period for both tabs: today (since midnight, India time), or the last N days.
const PERIODS = [['1', 'Today'], ['7', '1 week'], ['30', '1 month'], ['90', '3 months'], ['0', 'All']];
let period = '0';
const since = () => period === '0' ? 0 : period === '1' ? new Date(istDay(Date.now()) + 'T00:00:00+05:30').getTime() : Date.now() - (+period) * 864e5;
// Reports are filtered by when they were published; the map and patterns by when the incident happened.
const inPeriod = e => new Date(e.last).getTime() >= since();
const happenedInPeriod = e => new Date(e.d).getTime() + 12 * 3600e3 >= since();
// The report that best stands for an incident: the latest one about the incident itself, not a follow-up.
const lead = e => e.reports.find(r => r.k !== 'f') || e.reports[0];
function drawPeriod() {
  $('period').innerHTML = PERIODS.map(([p, name]) => `<button class="${p === period ? 'on' : ''}" data-p="${p}" aria-pressed="${p === period}">${name}</button>`).join('');
}
$('period').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  period = b.dataset.p; newsN = 60; drawPeriod(); drawNews(); if (!$('sitv').classList.contains('hide')) drawSits(); if (!$('ocv').classList.contains('hide')) drawOc(); if (!$('anv').classList.contains('hide')) drawAn();
  if (!$('mapv').classList.contains('hide')) drawMap();
};

let newsCat = '', newsN = 60;
function drawNews() {
  const inP = EVENTS.filter(e => inPeriod(e) && inView(e));
  const used = new Set(inP.map(e => e.c));
  if (newsCat && !used.has(newsCat)) newsCat = '';
  $('newsFilter').innerHTML = `<button class="${newsCat ? '' : 'on'}" data-c="">All</button>` +
    CATS.filter(c => used.has(c.id)).map(c => `<button class="${newsCat === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  const rows = inP.filter(e => !newsCat || e.c === newsCat);
  if (!rows.length) { $('newsList').innerHTML = `<div class="empty">${EVENTS.length ? 'No incidents reported in this period.' : 'Nothing here yet.'}</div>`; return; }
  const today = istDay(Date.now()), yest = istDay(Date.now() - 864e5);
  let html = '', day = '';
  for (const e of rows.slice(0, newsN)) {
    const d = istDay(e.last);
    if (d !== day) { day = d; html += `<div class="day label">${d === today ? 'Today' : d === yest ? 'Yesterday' : fmtDay(e.last)}</div>`; }
    const r = lead(e);
    const others = e.reports.filter(x => x !== r).filter((x, i, a) => a.findIndex(y => y.s === x.s) === i && x.s !== r.s);
    const follows = e.orphan ? 0 : e.reports.filter(x => x.k === 'f').length;
    const happened = e.stated && !e.orphan && istDay(e.d) !== istDay(e.last) ? ` · happened ${fmtDay(e.d)}` : '';
    html += `<article class="item">
      <div class="top"><span class="cat${e.orphan ? ' fu' : ''}">${e.orphan ? 'Follow-up · ' : ''}${esc(label(e))}</span><span class="when">${ago(e.last)}</span></div>
      ${link(r, esc(r.t)).replace('<a ', '<a class="head" ')}
      ${r.L && r.L.s && /[ऀ-ॿ]/.test(r.t) ? `<p class="sum">${esc(r.L.s)}</p>` : ''}
      <div class="by"><b>${e.a ? esc(AREA[e.a].name) + (e.p ? ' · ' + esc(e.p[0]) : '') : 'Area not stated'}</b>${happened} · ${esc(SRC[r.s] || r.s)}${others.length ? ' · also ' + others.map(x => link(x, esc(SRC[x.s] || x.s))).join(', ') : ''}${follows ? ` · ${follows} follow-up${follows > 1 ? 's' : ''}` : ''}${e.q === 'none' ? ` · <span class="chk" title="The AI reading of this article disagrees with the rules; a second reading will settle it">check: AI reads this as not an incident</span>` : e.q && CAT[e.q] ? ` · <span class="chk" title="The machine reading disagrees with the rules">check type: reads as ${esc(CAT[e.q].name.toLowerCase())}</span>` : ''}</div>
    </article>`;
  }
  if (rows.length > newsN) html += '<button class="more" id="more">Show earlier</button>';
  $('newsList').innerHTML = html;
}
$('newsFilter').onclick = e => { const b = e.target.closest('button'); if (b) { newsCat = b.dataset.c; newsN = 60; drawNews(); } };
$('newsList').onclick = e => { if (e.target.id === 'more') { newsN += 60; drawNews(); } };

/* ---------- Map ---------- */
let MAP, LAYER, BASE, picked = null;
function initMap() {
  MAP = L.map('map', { zoomControl: true, scrollWheelZoom: false }).setView([18.53, 73.86], 11);
  MAP.attributionControl.setPrefix(false);
  setBase();
  LAYER = L.layerGroup().addTo(MAP);
}
function setBase() {
  if (BASE) { MAP.removeLayer(BASE); BASE = null; }
  try {
    if (window.maplibregl && L.maplibreGL) BASE = L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/' + (isDarkTheme() ? 'dark' : 'positron'), attribution: '© OpenFreeMap · OpenMapTiles · OpenStreetMap' }).addTo(MAP);
  } catch {}
  if (!BASE) BASE = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAP);
}

function current() {
  const cat = $('fCat').value, t = $('fTime').value;
  return INCIDENTS.filter(e =>
    happenedInPeriod(e) && (!cat || e.c === cat) &&
    (!t || (t === 'dark' ? isDark(e) : e.b === t)) && inView(e));
}
const tally = (list, key) => { const m = {}; for (const x of list) { const k = key(x); if (k != null) m[k] = (m[k] || 0) + 1; } return m; };
const top = (m, n) => Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n);
const rowsOf = (pairs, label) => { const mx = Math.max(1, ...pairs.map(p => p[1])); return pairs.map(([k, v]) => `<div class="row"><span>${esc(label(k))}</span><span class="n">${v}</span><div class="track"><i style="width:${v / mx * 100}%"></i></div></div>`).join(''); };

// Drawn as precisely as the reports allow, and no more:
//   a solid dot   the spot the report names (a hill, chowk, bridge, society, station)
//   a ring        the neighbourhood or village the report names
//   a faint disc  only the area is known: a count at the area centre, never read as a location
function drawMap() {
  if (!MAP) initMap();
  const ev = current(), placed = ev.filter(e => e.a), copper = css('--copper');
  LAYER.clearLayers();
  const per = {}, rough = {};
  for (const e of placed) { (per[e.a] = per[e.a] || []).push(e); if (!e.p) (rough[e.a] = rough[e.a] || []).push(e); }
  if (picked && !per[picked]) picked = null;
  const pick = id => { picked = id; drawMap(); if (innerWidth < 960) $('areaBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  for (const [id, list] of Object.entries(rough)) {
    const a = AREA[id], on = id === picked;
    L.circleMarker([a.lat, a.lon], { radius: 8 + Math.sqrt(list.length) * 3.2, color: copper, weight: 1, dashArray: '3 4', opacity: on ? .9 : .55, fillColor: copper, fillOpacity: on ? .22 : .07 })
      .bindTooltip(String(list.length), { permanent: true, direction: 'center', className: 'lbl' })
      .on('click', () => pick(id)).addTo(LAYER);
  }
  const spots = placed.filter(e => e.p);
  for (const e of spots) {
    const exact = e.p[3] === 'x', r = lead(e);
    L.circleMarker([e.p[1], e.p[2]], { radius: exact ? 5 : 6, color: copper, weight: exact ? 1 : 1.6, fillColor: copper, fillOpacity: exact ? .85 : 0 })
      .bindPopup(`<div class="cat">${esc(label(e))}</div><div style="margin:3px 0 4px">${link(r, esc(r.t))}</div><div class="by">${esc(e.p[0])} · ${fmtDay(e.d)}</div>`)
      .on('click', () => { picked = e.a; drawArea(); })
      .addTo(LAYER);
  }
  const none = ev.length - placed.length, nx = spots.filter(e => e.p[3] === 'x').length;
  $('count').innerHTML = `<b>${ev.length}</b> incidents · <b>${nx}</b> at a named spot (dots), <b>${spots.length - nx}</b> at a neighbourhood or village (rings), <b>${placed.length - spots.length}</b> known only to the area (faint discs, counted at the area centre)${none ? ` · ${none} with no area stated` : ''}.`;
  drawArea(); drawPatterns(ev);
}
const label = e => CAT[e.c].name + (e.o && !(e.c === 'murder' && e.o === 'fatal') ? ' · ' + e.o : '');

function drawArea() {
  if (!picked) { $('areaBox').innerHTML = `<section class="sec"><h3 class="label">Area</h3><p class="note" style="margin-top:0">Select a circle on the map to see that area.</p></section>`; return; }
  const list = current().filter(e => e.a === picked), timed = list.filter(e => e.b);
  $('areaBox').innerHTML = `<section class="sec"><h3 class="label">Area</h3>
    <h2>${esc(AREA[picked].name)}</h2>
    <div class="two">
      <div><div class="label">By type · ${list.length}</div>${rowsOf(top(tally(list, e => e.c), 12), k => CAT[k].name)}</div>
      <div><div class="label">By time of day</div>${timed.length ? rowsOf(BANDS.map(b => [b, timed.filter(e => e.b === b).length]), k => BAND_NAME[k]) : ''}
        <p class="note">${timed.length ? `${list.length - timed.length} of ${list.length} did not state a time.` : 'No report here stated a time of day.'}</p></div>
    </div>
    <div style="margin-top:18px">${[...list].sort((x, y) => (x.d < y.d ? 1 : -1)).slice(0, 8).map(e => `<div class="mini">${fmtDay(e.d)} · ${esc(label(e))}${e.p ? " · " + esc(e.p[0]) : ""}<br>${link(lead(e), esc(lead(e).t))}${e.reports.length > 1 ? ` <span style="color:var(--ink-3)">· ${e.reports.length} reports</span>` : ''}</div>`).join('')}</div>
  </section>`;
}

/* ---------- Patterns ---------- */
function drawPatterns(ev) {
  const placed = ev.filter(e => e.a), out = [];
  const sec = (title, body) => `<section class="sec"><h3 class="label">${title}</h3>${body}</section>`;
  if (placed.length < 25) {
    $('patterns').innerHTML = sec('Patterns', `<p class="say">Too early to say. ${placed.length} placed incidents in this view; patterns are shown from about 25, so that areas can be compared fairly.</p><p class="note">The history grows every hour.</p>`);
    return;
  }
  const byCat = {}, byArea = {};
  for (const e of placed) { (byCat[e.c] = byCat[e.c] || []).push(e); (byArea[e.a] = byArea[e.a] || []).push(e); }

  const conc = CATS.filter(c => (byCat[c.id] || []).length >= 5).map(c => {
    const t = top(tally(byCat[c.id], e => e.a), 3);
    return `<p class="say"><b>${esc(c.name)}</b> is reported most in ${t.map(([a, n]) => `${esc(AREA[a].name)} <em>${n}</em>`).join(', ')}.</p>`;
  });
  if (conc.length) out.push(sec('Where each type concentrates', conc.join('')));

  const share = tally(placed, e => e.c), lifts = [];
  for (const [a, list] of Object.entries(byArea)) {
    if (list.length < 8) continue;
    for (const [c, n] of Object.entries(tally(list, e => e.c))) {
      const here = n / list.length, city = share[c] / placed.length;
      if (n >= 4 && here >= city * 1.6) lifts.push({ a, c, n, here, city, x: here / city });
    }
  }
  lifts.sort((p, q) => q.x - p.x);
  out.push(sec('What stands out by area', lifts.length ? lifts.slice(0, 8).map(l =>
    `<p class="say"><b>${esc(AREA[l.a].name)}</b>: ${esc(CAT[l.c].name.toLowerCase())} is <em>${Math.round(l.here * 100)}%</em> of incidents here (${l.n} of ${byArea[l.a].length}), against ${Math.round(l.city * 100)}% across all areas.</p>`).join('')
    : '<p class="note" style="margin-top:0">No area yet has enough incidents (8, with 4 of one type) to say what is unusual about it.</p>'));

  const night = Object.entries(byArea).map(([a, list]) => { const t = list.filter(e => e.b); return { a, t: t.length, d: t.filter(isDark).length }; }).filter(x => x.t >= 5).sort((p, q) => q.d / q.t - p.d / p.t);
  out.push(sec('After dark · 7pm–6am', (night.length ? night.slice(0, 8).map(x =>
    `<p class="say"><b>${esc(AREA[x.a].name)}</b>: <em>${Math.round(x.d / x.t * 100)}%</em> after dark (${x.d} of ${x.t} with a stated time).</p>`).join('')
    : '<p class="note" style="margin-top:0">No area yet has 5 incidents with a stated time.</p>')));

  const rows = CATS.filter(c => ev.some(e => e.c === c.id)).map(c => {
    const l = ev.filter(e => e.c === c.id), v = BANDS.map(b => l.filter(e => e.b === b).length), mx = Math.max(...v);
    return `<tr><td>${esc(c.name)}</td>${v.map(n => `<td class="${n && n === mx ? 'hi' : n ? '' : 'z'}">${n || '–'}</td>`).join('')}<td class="${l.some(e => !e.b) ? '' : 'z'}">${l.filter(e => !e.b).length || '–'}</td></tr>`;
  });
  out.push(sec('Type by time of day', `<table><tr><th></th><th>Morn</th><th>Aft</th><th>Eve</th><th>Night</th><th>n/s</th></tr>${rows.join('')}</table><p class="note">n/s: the report did not state a time.</p>`));
  $('patterns').innerHTML = out.join('');
}

function drawSources() {
  $('sources').innerHTML = STATUS
    ? STATUS.sources.map(s => `<div class="src ${s.ok ? '' : 'off'}"><span>${esc(s.name)}</span><span>${s.ok ? `${s.found} incident items in feed` : 'not reachable'}</span></div>`).join('') + `<p class="note">Last checked ${new Date(STATUS.updated).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}.</p>`
    : '<p class="note" style="margin-top:0">No collector run recorded yet.</p>';
}

/* ---------- Situations (public order) ---------- */
// Protests, bandhs, road blockades, strikes, unrest, prohibitory orders: from our papers and Google News searches.
// Planned = announced for a later day; Today & ongoing = today, or a report says it continues; Recent = the rest.
let SITS = [], SITSTATUS = null;
const SITK = Object.fromEntries((META.sitkinds || []).map(k => [k.id, k.name]));
// A situation that names no area but says Pune belongs to the Pune City view.
const sitInView = g => view === 'all' || (g.a ? areaInView(g.a) : view === 'city');
function drawSits() {
  const today = istDay(Date.now()), yest = istDay(Date.now() - 864e5);
  const recentFrom = period === '0' ? '0000' : istDay(since());
  const live = g => g.w === today || (g.st === 'on' && istDay(g.last) >= yest);
  const list = SITS.filter(sitInView);
  const planned = list.filter(g => g.w > today).sort((x, y) => (x.w < y.w ? -1 : 1));
  const now = list.filter(g => g.w <= today && live(g));
  const recent = list.filter(g => g.w < today && !live(g) && g.w >= recentFrom);
  const item = g => {
    const r = g.reports[0], papers = [...new Set(g.reports.map(x => x.n))];
    const when = g.w > today ? (g.w === istDay(Date.now() + 864e5) ? 'Tomorrow' : fmtDay(g.w + 'T06:30:00Z')) : g.w === today ? 'Today' : fmtDay(g.w + 'T06:30:00Z');
    return `<article class="item">
      <div class="top"><span class="cat">${esc(SITK[g.k] || g.k)}</span><span class="when">${when}</span></div>
      ${link(r, esc(r.t)).replace('<a ', '<a class="head" ')}
      <div class="by"><b>${g.a ? esc(AREA[g.a].name) + (g.p ? ' · ' + esc(g.p[0]) : '') : 'Pune'}</b> · ${papers.slice(0, 3).map(esc).join(', ')}${papers.length > 3 ? ' and ' + (papers.length - 3) + ' more' : ''}${g.reports.length > 1 ? ` · ${g.reports.length} reports` : ''}</div>
    </article>`;
  };
  const block = (title, arr, empty) => `<div class="day label">${title}</div>` + (arr.length ? arr.map(item).join('') : `<p class="note" style="margin:10px 0 0">${empty}</p>`);
  $('sitIntro').textContent = `${planned.length} planned · ${now.length} today or ongoing · ${recent.length} recent. Protests, bandhs, road blockades, strikes, unrest and prohibitory orders, from local papers and Google News.`;
  $('sitList').innerHTML = block('Planned', planned, 'Nothing announced for the coming days.') + block('Today & ongoing', now, 'Nothing reported for today.') + block('Recent', recent, 'Nothing in this period.');
}
// How fresh the Reports and Situations tabs are, shown at the top right under the period.
// The scan clock (clock.yml) starts Situations at :00, :15, :30, :45 (sitstatus "scanned" = when it started) and Reports
// at :17 past each hour (status "updated" = when it finished, ~25 min later). Past the due time the scan is under way.
let scanTab = 'news';
function drawScan() {
  const el = $('scanLine');
  if (scanTab !== 'news' && scanTab !== 'sit') { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  const t = ms => { const d = new Date(ms); return (istDay(ms) === istDay(Date.now()) ? '' : fmtDay(ms) + ', ') + d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' }); };
  let lastIso, next, every;
  if (scanTab === 'sit') {
    if (!SITSTATUS) { el.innerHTML = 'Last scan: not yet run<br>Next scan: within 15 min'; return; }
    every = SITSTATUS.every || 15; lastIso = SITSTATUS.scanned;
    const step = every * 60e3; next = Math.floor(new Date(lastIso).getTime() / step) * step + step; // the slot after the one that ran
  } else {
    if (!STATUS) { el.innerHTML = 'Last scan: not yet run<br>Next scan: within the hour'; return; }
    every = 60; lastIso = STATUS.updated;
    const h = 3600e3, off = 17 * 60e3, last = new Date(lastIso).getTime();
    next = Math.floor((last - off) / h) * h + off + h; // the next :17 after the run that produced this
  }
  el.innerHTML = `Last scan <b>${t(new Date(lastIso).getTime())}</b> · ${ago(lastIso)}<br>` +
    (Date.now() >= next ? `<span class="late">Next scan in progress</span>`
          : `Next scan at <b>${t(next)}</b> · every ${every === 60 ? 'hour' : every + ' min'}`);
}
// Every minute: re-read the two small status files; when a new scan has landed, reload that tab's data and redraw.
async function refresh() {
  try {
    const [s, ss] = await Promise.all([j('data/status.json').catch(() => null), j('data/sitstatus.json').catch(() => null)]);
    if (ss && (!SITSTATUS || ss.scanned !== SITSTATUS.scanned)) {
      try { SITS = await j('data/situations.json'); } catch {}
      SITSTATUS = ss; if (!$('sitv').classList.contains('hide')) drawSits();
    }
    if (s && (!STATUS || s.updated !== STATUS.updated)) {
      await load();   // new reports: re-read everything the other tabs use, then redraw the open one
      if (!$('mapv').classList.contains('hide')) drawMap();
      if (!$('ocv').classList.contains('hide')) drawOc();
      if (!$('anv').classList.contains('hide')) drawAn();
    }
  } catch {}
  drawScan();
  // A newer version of this page itself has been published: reload once to pick it up (browsers keep pages ~10 min).
  try {
    const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
    const ver = r.headers.get('etag') || r.headers.get('last-modified');
    let tried = null; try { tried = sessionStorage.getItem('vidraksh-reloaded'); } catch {}
    if (ver && PAGEVER && ver !== PAGEVER && ver !== tried && document.activeElement?.tagName !== 'INPUT') {
      try { sessionStorage.setItem('vidraksh-reloaded', ver); } catch {}   // at most one reload per new version
      location.reload();
    }
  } catch {}
}
// The version of the page now open: the browser's own copy of it (no network), so a stale copy is caught on the first check.
let PAGEVER = null;
fetch(location.pathname, { cache: 'force-cache' }).then(r => { PAGEVER = r.headers.get('etag') || r.headers.get('last-modified'); }).catch(() => {});
setTimeout(refresh, 5e3);
setInterval(refresh, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

/* ---------- Organised crime ---------- */
// Groups as publicly reported, from the engine's incidents and each group's own searches (groups.json, hourly).
// Leaders are named as the press names them: accused, not convicted unless a report says so.
let OC = null, ocOpen = null;
const OC_TYPE = { syndicate: 'Organised gang', crew: 'Crew', external: 'Outside gang with Pune links', pattern: 'Pattern, not one gang' };
const OC_ACT = { mcoca: 'MCOCA', mpda: 'MPDA detention', extern: 'Externment', arrest: 'Arrests', property: 'Property action' };
const OC_WPN = { koyta: 'Koyta (sickle)', firearm: 'Firearm', blade: 'Sword or knife' };
const ocDay = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kolkata' });
const ocInView = r => view === 'all' || !r.a || areaInView(r.a);
// Words to search the groups' reports by. A report counts if the engine tagged it (weapon, police action, minor) or its
// headline uses the word (English, Marathi or the usual misspellings). Only words found in at least one report are offered.
const OC_KEYS = [
  { name: 'Koyta', alias: ['koyta', 'koita', 'sickle', 'कोयता'], test: r => (r.wpn || []).includes('koyta') || /koyta|koita|कोयत/i.test(r.t) },
  { name: 'Firearm', alias: ['firearm', 'pistol', 'gun', 'firing', 'revolver', 'पिस्तूल', 'गोळीबार'], test: r => (r.wpn || []).includes('firearm') || /pistol|firing|fired|gun|revolver|पिस्तूल|पिस्तुल|गोळीबार/i.test(r.t) },
  { name: 'Sword or knife', alias: ['sword', 'knife', 'blade', 'talwar', 'तलवार'], test: r => (r.wpn || []).includes('blade') || /sword|knife|talwar|तलवार|चाकू/i.test(r.t) },
  { name: 'MCOCA', alias: ['mcoca', 'macoca', 'mokka', 'mocca', 'मोक्का'], test: r => (r.act || []).includes('mcoca') || /mcoca|macoca|mokka|मोक्का/i.test(r.t) },
  { name: 'MPDA', alias: ['mpda', 'detention', 'स्थानबद्ध'], test: r => (r.act || []).includes('mpda') || /mpda|स्थानबद्ध/i.test(r.t) },
  { name: 'Externment', alias: ['externment', 'externed', 'tadipar', 'तडीपार'], test: r => (r.act || []).includes('extern') || /extern|tadipar|तडीपार/i.test(r.t) },
  { name: 'Arrest', alias: ['arrest', 'arrested', 'held', 'अटक'], test: r => (r.act || []).includes('arrest') || /arrest|अटक/i.test(r.t) },
  { name: 'Property action', alias: ['property', 'demolition', 'seized', 'जप्त'], test: r => (r.act || []).includes('property') },
  { name: 'Extortion', alias: ['extortion', 'ransom', 'khandani', 'खंडणी'], test: r => /extort|ransom|खंडणी/i.test(r.t) },
  { name: 'Murder', alias: ['murder', 'killed', 'hacked', 'खून', 'हत्या'], test: r => /murder|killed|hacked to death|खून|हत्या/i.test(r.t) },
  { name: 'Attack', alias: ['attack', 'assault', 'hamla', 'हल्ला'], test: r => /attack|assault|हल्ला/i.test(r.t) },
  { name: 'Rivalry or revenge', alias: ['rivalry', 'rival', 'revenge', 'feud', 'वर्चस्व', 'बदला'], test: r => /rival|revenge|feud|वर्चस्व|बदला/i.test(r.t) },
  { name: 'Drugs', alias: ['drugs', 'mephedrone', 'md', 'ganja', 'narcotics', 'अमली'], test: r => /drug|mephedrone|ganja|narcotic|अमली|गांजा/i.test(r.t) },
  { name: 'Land grabbing', alias: ['land', 'land grabbing', 'encroachment', 'जमीन'], test: r => /land.?grab|encroach|जमीन/i.test(r.t) },
  { name: 'Minors involved', alias: ['minor', 'minors', 'juvenile', 'अल्पवयीन'], test: r => !!r.j }
];
const ocKey = q => OC_KEYS.find(k => k.name.toLowerCase() === q || k.alias.includes(q));
function ocMatch(g, q) {
  if (!q) return true;
  const k = ocKey(q);
  if (k) return (g.reports || []).some(k.test);
  const hay = [g.name, g.leader, g.about, g.id, ...(g.areas || []).map(([a]) => AREA[a] ? AREA[a].name : a)].join(' ').toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w)) || (g.reports || []).some(r => r.t.toLowerCase().includes(q));
}

/* Search suggestions: groups and words, as you type (arrow keys + Enter, or click). */
let sugItems = [], sugOn = -1;
function drawSug() {
  if (!OC) return;
  const q = $('ocQ').value.trim().toLowerCase(), box = $('ocSug');
  const gs = OC.groups.filter(g => g.n && (!q || [g.name, g.leader || '', g.id].join(' ').toLowerCase().includes(q))).sort((a, b) => b.n - a.n);
  const ks = OC_KEYS.map(k => ({ k, n: new Set(OC.groups.flatMap(g => (g.reports || []).filter(k.test).map(r => r.u))).size }))
    .filter(({ k, n }) => n && (!q || k.name.toLowerCase().includes(q) || k.alias.some(a => a.startsWith(q))));
  sugItems = [...gs.slice(0, q ? 8 : 40).map(g => ({ g })), ...ks];
  if (!sugItems.length || document.activeElement !== $('ocQ')) { box.classList.add('hide'); $('ocQ').setAttribute('aria-expanded', 'false'); return; }
  sugOn = Math.min(sugOn, sugItems.length - 1);
  let i = 0;
  const btn = (main, side) => `<button type="button" role="option" data-i="${i}" class="${i++ === sugOn ? 'on' : ''}"><span>${main}</span><span>${side}</span></button>`;
  box.innerHTML = (gs.length ? `<div class="sh label">Groups</div>` + gs.slice(0, q ? 8 : 40).map(g => btn(esc(g.name), `${esc(OC_TYPE[g.type] || g.type)} · ${g.n} reports`)).join('') : '') +
    (ks.length ? `<div class="sh label">Words in reports</div>` + ks.map(({ k, n }) => btn(esc(k.name), `${n} report${n > 1 ? 's' : ''}`)).join('') : '');
  box.classList.remove('hide'); $('ocQ').setAttribute('aria-expanded', 'true');
}
function pickSug(i) {
  const it = sugItems[i]; if (!it) return;
  if (it.g) { $('ocQ').value = ''; ocOpen = it.g.id; } else { $('ocQ').value = it.k.name; ocOpen = null; }
  $('ocSug').classList.add('hide'); $('ocQ').blur(); drawOc();
}
$('ocQ').onfocus = () => { sugOn = -1; drawSug(); };
$('ocQ').onblur = () => setTimeout(() => $('ocSug').classList.add('hide'), 150);
$('ocQ').onkeydown = e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sugOn = (sugOn + (e.key === 'ArrowDown' ? 1 : -1) + sugItems.length) % Math.max(1, sugItems.length); drawSug(); }
  else if (e.key === 'Enter') { if (sugOn >= 0) { e.preventDefault(); pickSug(sugOn); } else { $('ocSug').classList.add('hide'); } }
  else if (e.key === 'Escape') $('ocSug').classList.add('hide');
};
$('ocSug').onmousedown = e => { const b = e.target.closest('button'); if (b) { e.preventDefault(); pickSug(+b.dataset.i); } };
const ocRows = (pairs, label, total) => pairs.map(([k, n]) => `<div class="row"><span>${esc(label(k))}</span><span class="n">${n}</span><div class="track"><i style="width:${Math.min(100, n / total * 100)}%"></i></div></div>`).join('');
function drawOc() {
  if (!OC) { $('ocBody').innerHTML = '<div class="empty">The first organised-crime scan has not run yet. It runs with every hourly collection.</div>'; $('ocNote').textContent = ''; $('ocGraph').innerHTML = ''; return; }
  $('ocNote').textContent = 'Groups as publicly reported. Leaders are named as the press names them: accused, not convicted unless a report says so. Minors and victims of sexual offences are never named.';
  const q = $('ocQ').value.trim().toLowerCase();
  drawOcGraph(q);
  const g = ocOpen && OC.groups.find(x => x.id === ocOpen);
  if (g) { drawOcProfile(g); return; }
  const key = ocKey(q), test = key ? key.test : r => r.t.toLowerCase().includes(q);
  const list = OC.groups.filter(x => x.n && ocMatch(x, q));
  if (key) list.sort((a, b) => (b.reports || []).filter(test).length - (a.reports || []).filter(test).length);
  const seen = new Set();
  const hits = q ? OC.groups.flatMap(x => (x.reports || []).filter(r => test(r) && ocInView(r)).map(r => ({ ...r, g: x })))
    .filter(r => !seen.has(r.u) && seen.add(r.u)).sort((a, b) => (a.d < b.d ? 1 : -1)) : [];
  const card = x => {
    const acts = Object.fromEntries(x.actions || []), mine = (x.reports || []).filter(ocInView);
    const where = (x.areas || []).slice(0, 3).map(([a]) => AREA[a] ? esc(AREA[a].name) : esc(a)).join(', ');
    return `<article class="item ocard" data-g="${x.id}">
      <div class="top"><span class="cat">${esc(OC_TYPE[x.type] || x.type)}</span><span class="when">${x.active ? 'Active' : 'Quiet'} · last ${ocDay(x.last)}</span></div>
      <a class="head" href="#oc" data-g="${x.id}">${esc(x.name)}</a>
      <div class="by">${x.leader ? `<b>${esc(x.leader)}</b> <span class="acc">accused</span> · ` : ''}${x.n} reports${x.incidents ? ` · ${x.incidents} incidents in the engine` : ''}${acts.mcoca ? ` · MCOCA in ${acts.mcoca}` : ''}${where ? ' · ' + where : ''}${view !== 'all' ? ` · ${mine.length} in this view` : ''}${key ? ` · <b>${(x.reports || []).filter(test).length}</b> mention ${esc(key.name.toLowerCase())}` : ''}</div>
    </article>`;
  };
  $('ocBody').innerHTML = (list.length ? list.map(card).join('') : `<div class="empty">No group matches “${esc(q)}”.</div>`) +
    (hits.length ? `<div class="day label">Reports mentioning “${esc(key ? key.name : q)}” · ${hits.length}</div>` +
      hits.slice(0, 30).map(r => `<div class="mini">${ocDay(r.d)} · ${esc(r.g.name)}<br>${link(r, esc(r.t))}</div>`).join('') : '');
}
function drawOcProfile(g) {
  const reps = (g.reports || []).filter(ocInView);
  const months = g.months || [], max = Math.max(1, ...months.map(m => m[1]));
  const sec = (title, body) => body ? `<section class="sec"><h3 class="label">${title}</h3>${body}</section>` : '';
  const tags = r => [...(r.act || []).map(k => OC_ACT[k]), ...(r.wpn || []).map(k => OC_WPN[k]), r.j ? 'minor involved' : ''].filter(Boolean);
  const linked = (g.linked || []).map(([id, n]) => {
    const o = OC.groups.find(x => x.id === id);
    return `<div class="mini"><a href="#oc" data-g="${id}">${esc(o ? o.name : id)}</a> · named together in ${n} report${n > 1 ? 's' : ''}</div>`;
  }).join('');
  const signals = [g.juvenile ? `${g.juvenile} report${g.juvenile > 1 ? 's' : ''} involve minors (never named here).` : '',
    g.rivalry ? `${g.rivalry} report${g.rivalry > 1 ? 's' : ''} speak of rivalry or revenge.` : ''].filter(Boolean).join(' ');
  $('ocBody').innerHTML = `<p style="margin:18px 0 0"><a href="#oc" id="ocBack" class="label" style="text-decoration:none">← All groups</a></p>
    <h2 class="ocname">${esc(g.name)}</h2>
    <div class="by">${esc(OC_TYPE[g.type] || g.type)}${g.leader ? ` · led by <b>${esc(g.leader)}</b> <span class="acc">accused, not convicted unless a report says so</span>` : ''}</div>
    ${g.about ? `<p class="say" style="margin-top:12px">${esc(g.about)}</p>` : ''}
    <p class="say" style="margin-top:12px"><b>${g.n}</b> reports from ${ocDay(g.first)} to ${ocDay(g.last)}${g.incidents ? `, <b>${g.incidents}</b> of them incidents in the engine` : ''}. ${g.active ? '<em>Active</em> in the last four months.' : 'Quiet for over four months.'}</p>
    ${sec('Police action', ocRows(g.actions || [], k => OC_ACT[k] || k, g.n))}
    ${sec('Where', ocRows((g.areas || []).slice(0, 8), a => AREA[a] ? AREA[a].name : a, (g.areas || [[0, 1]])[0][1]))}
    ${sec('Weapons named', ocRows(g.weapons || [], k => OC_WPN[k] || k, g.n))}
    ${sec('Linked groups', linked)}
    ${sec('Signals', signals ? `<p class="note" style="margin-top:0">${signals}</p>` : '')}
    ${sec('Reports by month', months.length ? `<div class="spark">${months.map(([m, n]) => `<i title="${m}: ${n}" style="height:${Math.max(6, n / max * 100)}%"></i>`).join('')}</div><p class="note">${months[0][0]} to ${months[months.length - 1][0]}</p>` : '')}
    ${sec(`Reports${view !== 'all' ? ' in this view' : ''} · ${reps.length}`, reps.map(r => `<div class="mini">${ocDay(r.d)}${r.a && AREA[r.a] ? ' · ' + esc(AREA[r.a].name) : ''}${tags(r).length ? ' · ' + tags(r).join(', ') : ''}<br>${link(r, esc(r.t))} <span style="color:var(--ink-3)">· ${esc(SRC[r.n] || r.n)}</span></div>`).join('') || '<p class="note" style="margin-top:0">None in this view.</p>')}`;
}
$('ocBody').onclick = e => {
  if (e.target.closest('#ocBack')) { e.preventDefault(); ocOpen = null; drawOc(); return; }
  const a = e.target.closest('[data-g]');
  if (a && !e.target.closest('a[target]')) { e.preventDefault(); ocOpen = a.dataset.g; drawOc(); ocToTop(); }
};
// After opening a profile, bring the right-hand column's top into view if it has scrolled away.
function ocToTop() { const y = $('ocBody').getBoundingClientRect().top; if (y < 120 || y > innerHeight) scrollTo({ top: scrollY + y - 130 }); }
$('ocQ').oninput = () => { ocOpen = null; sugOn = -1; drawSug(); drawOc(); };

/* Gang links: groups named together in reports. A search fades the groups it does not match; an open profile
   lights up that group and the groups linked to it. */
function drawOcGraph(q) {
  const gs = OC.groups.filter(g => g.n);
  if (!gs.length) { $('ocGraph').innerHTML = '<div class="empty">The organised-crime profiles have not been built yet.</div>'; return; }
  const W = 760, H = 560, cx = W / 2, cy = H / 2, R = 200, maxN = Math.max(...gs.map(g => g.n));
  const pos = Object.fromEntries(gs.map((g, i) => [g.id, [cx + R * Math.cos(-Math.PI / 2 + i * 2 * Math.PI / gs.length), cy + R * Math.sin(-Math.PI / 2 + i * 2 * Math.PI / gs.length)]]));
  const edges = []; gs.forEach(g => (g.linked || []).forEach(([o, n]) => { if (pos[o] && g.id < o) edges.push([g.id, o, n]); }));
  const maxE = Math.max(1, ...edges.map(e => e[2]));
  const sel = ocOpen && pos[ocOpen] ? ocOpen : null;
  const near = sel ? new Set([sel, ...edges.filter(e => e[0] === sel || e[1] === sel).flatMap(e => [e[0], e[1]])]) : null;
  const hit = q ? new Set(gs.filter(g => ocMatch(g, q)).map(g => g.id)) : null;
  const lit = id => (!near || near.has(id)) && (!hit || hit.has(id));
  let s = edges.map(([a, b, n]) => `<line x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}" class="gedge${sel && (a === sel || b === sel) ? ' hot' : ''}${lit(a) && lit(b) ? '' : ' dim'}" data-a="${a}" data-b="${b}" stroke-width="${1 + 7 * n / maxE}"${tip(`${gs.find(g => g.id === a).name} and ${gs.find(g => g.id === b).name}: named together in ${n} report${n > 1 ? 's' : ''}`)}/>`).join('');
  gs.forEach(g => {
    const [x, y] = pos[g.id], r = 10 + 26 * Math.sqrt(g.n / maxN), out = x > cx + 5 ? 'start' : x < cx - 5 ? 'end' : 'middle', dx = out === 'start' ? r + 8 : out === 'end' ? -r - 8 : 0, dy = out === 'middle' ? (y < cy ? -r - 10 : r + 18) : 4;
    s += `<g class="gnode${lit(g.id) ? '' : ' dim'}${g.id === sel ? ' sel' : ''}" data-g="${g.id}"${tip(`${g.name} · ${g.n} reports${g.active ? ' · active' : ' · quiet'}`)}><circle cx="${x}" cy="${y}" r="${r}" class="gfill" fill-opacity="${g.active ? .8 : .3}"/><text x="${x + dx}" y="${y + dy}" class="gtx" text-anchor="${out}">${esc(g.name.replace(' (Pune links)', ''))}</text></g>`;
  });
  $('ocGraph').innerHTML = `<div class="gscroll"><svg viewBox="-60 0 ${W + 120} ${H}" class="gsvg">${s}</svg></div><p class="note">Groups named together in the same reports: rivals, allies or the same case. Thicker line, more reports. Circle size: reports about the group; solid is active in the last four months, faint is quiet. Hover a group to light up its links; click it to open its profile.</p>`;
  $('ocGraph').querySelectorAll('.gnode').forEach(el => {
    el.onmouseenter = () => $('ocGraph').querySelectorAll('.gedge').forEach(l => l.classList.toggle('hot', l.dataset.a === el.dataset.g || l.dataset.b === el.dataset.g));
    el.onmouseleave = () => $('ocGraph').querySelectorAll('.gedge').forEach(l => l.classList.toggle('hot', !!sel && (l.dataset.a === sel || l.dataset.b === sel)));
    el.onclick = () => { ocOpen = el.dataset.g; drawOc(); ocToTop(); };
  });
}

/* ---------- Analytics ---------- */
// Findings per area view (insights.json, hourly): one sentence each, with the evidence and the test behind it.
// Nothing is shown below its minimum amount of data; an empty section says so.
let INS = null;
const TREND = { rising: 'Rising', steady: 'Steady', falling: 'Falling' };
function anEvidence(list) {
  if (!list || !list.length) return '';
  return `<div class="ev">${list.slice(0, 3).map(r => `<div class="mini">${fmtDay(r.d + 'T06:30:00Z')}${r.a && AREA[r.a] ? ' · ' + esc(AREA[r.a].name) : ''}<br>${link(r, esc(r.t))}</div>`).join('')}${list.length > 3 ? `<details><summary class="label">${list.length - 3} more</summary>${list.slice(3).map(r => `<div class="mini">${fmtDay(r.d + 'T06:30:00Z')}<br>${link(r, esc(r.t))}</div>`).join('')}</details>` : ''}</div>`;
}
function anCard(x) {
  return `<article class="item">
    ${x.trend ? `<div class="top"><span class="cat">${TREND[x.trend]}</span></div>` : ''}
    <p class="say" style="margin:4px 0 6px">${esc(x.title)}</p>
    ${(x.facts || []).length ? `<div class="by">${x.facts.map(esc).join(' · ')}</div>` : ''}
    ${x.test ? `<div class="how">How we know: ${esc(x.test)}</div>` : ''}
    ${anEvidence(x.evidence)}
  </article>`;
}
function drawAn() {
  $('anMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.anm === anMode));
  $('anBody').className = anMode === 'graphs' ? 'gwide' : 'wrap';
  if (anMode === 'graphs') { drawGraphs(); return; }
  if (!INS) { $('anBody').innerHTML = '<div class="empty">The first analysis has not run yet. It runs with every hourly collection.</div>'; return; }
  const v = INS.views[view] || INS.views.all, cov = v.coverage;
  const sec = (title, items, empty) => `<section class="sec"><h3 class="label">${title}</h3>${items.length ? items.map(anCard).join('') : `<p class="note" style="margin-top:0">${empty}</p>`}</section>`;
  const watch = [...v.watch,
    ...INS.gang.map(g => ({ title: g.title, evidence: g.evidence })),
    ...INS.planned.filter(p => view === 'all' || !p.a || areaInView(p.a)).map(p => ({ title: p.title + ' (' + fmtDay(p.d + 'T06:30:00Z') + ')', evidence: [{ t: 'Source report', u: p.u, d: p.d }] }))];
  $('anBody').innerHTML =
    `<p class="note" style="margin:16px 0 0">Last ${INS.window} days, ${cov.incidents} incidents in this view. Updated ${ago(INS.updated)}.</p>` +
    sec('Problems', v.problems, 'No problem in this view yet has enough incidents (four of one kind in one area in 90 days).') +
    sec('Watch', watch, 'No surge, gang violence or planned situation right now.') +
    sec('Possible series', v.series, 'No chain of three or more alike incidents close in place and time.') +
    sec('When', v.timing, 'No kind of incident yet differs from an even spread across the day or week (it needs about 30 incidents with a stated time).') +
    sec('Repeat places', v.places, 'No named spot has had more than one incident in 90 days.') +
    `<section class="sec"><h3 class="label">What this data can say</h3><p class="note" style="margin-top:0">${cov.spot} of ${cov.incidents} incidents are placed at a named spot, ${cov.timed} have a stated hour. ${cov.top_share}% of reports in this view come from one source (${esc(SRC[cov.top_source] || cov.top_source)}). ${esc(cov.note)}</p></section>`;
}

/* ---------- Graphs (inside Analytics) ---------- */
// Drawn from the incidents on the page, so every run and every new report changes them. They follow the area view and the
// period buttons; most also take a type. Hover for numbers; click a cell, bar or day to list its incidents below.
let anMode = 'findings', gSel = 'rhythm', gType = '', gSpread = true, gPick = null;
const GRAPHS = [['rhythm', 'Rhythm'], ['trend', 'Trend'], ['matrix', 'Where × what'], ['calendar', 'Calendar'], ['conc', 'Concentration'], ['harm', 'Harm']];
const G_ABOUT = {
  rhythm: 'Which hours of which days. After Clarke & Eck, Step 25 (chart C): days down the side, hours across, darker is more.',
  trend: 'Incidents per week, with the four-week average. Early weeks rest mostly on one paper’s history, so compare recent weeks with care.',
  matrix: 'Where each kind of incident happens: the busiest areas in this view against the types.',
  calendar: 'Every day’s incidents, with festivals marked. Look for the days around them.',
  conc: 'How concentrated incidents are across the areas of this view (the 80-20 rule, Step 18). The further the curve bows above the diagonal, the more a few areas carry the load.',
  harm: 'For each type, how many incidents were fatal, how many injured someone, and how many did not say.'
};
const BAND_HOURS = { morning: [6, 7, 8, 9, 10, 11], afternoon: [12, 13, 14, 15, 16], evening: [17, 18, 19, 20], night: [21, 22, 23, 0, 1, 2, 3, 4, 5] };
const DAYS7 = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
// Festivals of 2026 that move crowds, traffic and policing in Pune.
const FESTIVALS = [['2026-07-24', '2026-07-26', 'Palkhi / Ashadhi'], ['2026-09-14', '2026-09-25', 'Ganeshotsav'], ['2026-10-11', '2026-10-19', 'Navratri'], ['2026-10-20', '2026-10-20', 'Dussehra'], ['2026-11-06', '2026-11-11', 'Diwali']];
const gEv = (typed = true) => INCIDENTS.filter(e => inView(e) && happenedInPeriod(e) && (!typed || !gType || e.c === gType));
const wd = e => (new Date(e.d).getUTCDay() + 6) % 7;                 // Monday = 0
const dayKey = e => e.d.slice(0, 10);
const gBin = (v, max) => v <= 0 ? 0.045 : 0.16 + 0.84 * Math.ceil(Math.min(1, v / max) * 5) / 5;   // five shades, as in the book
const fmt1 = v => (Math.round(v * 10) / 10).toString();
const tip = (t) => ` data-tip="${esc(t)}"`;

function drawGraphs() {
  const typed = !['matrix', 'harm'].includes(gSel);
  const types = CATS.filter(c => INCIDENTS.some(e => e.c === c.id && inView(e)));
  $('anBody').innerHTML = `
    <div class="gbar">${GRAPHS.map(([k, n]) => `<button class="${k === gSel ? 'on' : ''}" data-gs="${k}">${n}</button>`).join('')}</div>
    <div class="gctl">${typed ? `<label><span class="label">Type</span><select id="gType"><option value="">All types</option>${types.map(c => `<option value="${c.id}"${c.id === gType ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>` : ''}
      ${gSel === 'rhythm' ? `<label class="tog"><input type="checkbox" id="gSpread"${gSpread ? ' checked' : ''}> Include reports that give only a part of day, spread across its hours</label>` : ''}</div>
    <p class="note gabout">${G_ABOUT[gSel]}</p>
    <div class="gbox" id="gBox"></div>
    <div id="gList"></div>`;
  ({ rhythm: gRhythm, trend: gTrend, matrix: gMatrix, calendar: gCalendar, conc: gConc, harm: gHarm })[gSel]();
  gListDraw();
}

function gListDraw() {
  if (!gPick) { $('gList').innerHTML = ''; return; }
  const list = gPick.list.slice().sort((x, y) => (x.d < y.d ? 1 : -1));
  $('gList').innerHTML = `<section class="sec"><h3 class="label">${esc(gPick.title)} · ${list.length}</h3>${list.slice(0, 40).map(e => {
    const r = lead(e);
    return `<div class="mini">${fmtDay(e.d)} · ${esc(label(e))}${e.a ? ' · ' + esc(AREA[e.a].name) : ''}<br>${link(r, esc(r.t))}</div>`;
  }).join('')}${list.length > 40 ? `<p class="note">and ${list.length - 40} more.</p>` : ''}</section>`;
}
const gPickSet = (title, list) => { gPick = { title, list }; gListDraw(); $('gList').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); };

/* Rhythm: Chart C, with the hour totals above (chart A) and the day totals beside it (chart B). */
function gRhythm() {
  const ev = gEv(), m = DAYS7.map(() => Array(24).fill(0)), who = DAYS7.map(() => Array.from({ length: 24 }, () => []));
  let exact = 0, spread = 0;
  for (const e of ev) {
    const d = wd(e);
    if (e.h != null) { m[d][e.h] += 1; who[d][e.h].push(e); exact++; }
    else if (gSpread && e.b && BAND_HOURS[e.b]) { const hs = BAND_HOURS[e.b]; for (const h of hs) { m[d][h] += 1 / hs.length; who[d][h].push(e); } spread++; }
  }
  const hourTot = Array.from({ length: 24 }, (_, h) => m.reduce((s, r) => s + r[h], 0)), dayTot = m.map(r => r.reduce((s, v) => s + v, 0));
  const max = Math.max(0.0001, ...m.flat()), W = 960, L = 46, R = 96, T = 86, cw = (W - L - R) / 24, ch = 32, H = T + 7 * ch + 46;
  const hmax = Math.max(0.0001, ...hourTot), dmax = Math.max(0.0001, ...dayTot), total = exact + spread;
  let s = '';
  hourTot.forEach((v, h) => { const bh = v / hmax * 62; s += `<rect x="${L + h * cw + 3}" y="${T - 10 - bh}" width="${cw - 6}" height="${bh}" class="gfill" fill-opacity=".75"${tip(`${String(h).padStart(2, '0')}:00–${String((h + 1) % 24).padStart(2, '0')}:00 · ${fmt1(v)} incidents (${total ? Math.round(v / total * 100) : 0}% of the week)`)}/>`; });
  m.forEach((row, d) => {
    s += `<text x="${L - 8}" y="${T + d * ch + ch / 2 + 4}" class="gtx" text-anchor="end">${DAYS7[d]}</text>`;
    row.forEach((v, h) => { s += `<rect x="${L + h * cw + 1}" y="${T + d * ch + 1}" width="${cw - 2}" height="${ch - 2}" class="gfill gcell" fill-opacity="${gBin(v, max)}" data-d="${d}" data-h="${h}"${tip(`${DAYS7[d]} ${String(h).padStart(2, '0')}:00 · ${fmt1(v)} incident${v === 1 ? '' : 's'}`)}/>`; });
    const bw = dayTot[d] / dmax * (R - 34);
    s += `<rect x="${W - R + 10}" y="${T + d * ch + 6}" width="${bw}" height="${ch - 12}" class="gfill" fill-opacity=".75"${tip(`${DAYS7[d]} · ${fmt1(dayTot[d])} incidents (${total ? Math.round(dayTot[d] / total * 100) : 0}%)`)}/><text x="${W - R + 14 + bw}" y="${T + d * ch + ch / 2 + 4}" class="gtx gsm">${total ? Math.round(dayTot[d] / total * 100) : 0}%</text>`;
  });
  for (let h = 0; h < 24; h += 3) s += `<text x="${L + h * cw + cw / 2}" y="${T + 7 * ch + 16}" class="gtx gsm" text-anchor="middle">${h === 0 ? '12am' : h < 12 ? h + 'am' : h === 12 ? '12pm' : (h - 12) + 'pm'}</text>`;
  const step = max / 5, lg = v => (max >= 5 ? Math.round(v) : fmt1(v));
  [0, 1, 2, 3, 4].forEach(i => { s += `<rect x="${L + i * 70}" y="${H - 18}" width="14" height="12" class="gfill" fill-opacity="${gBin(step * (i + 1), max)}"/><text x="${L + i * 70 + 19}" y="${H - 8}" class="gtx gsm">${lg(step * i)}–${lg(step * (i + 1))}</text>`; });
  s += `<text x="${L}" y="14" class="gtx gsm">Incidents by hour (all days)</text><text x="${W - R + 10}" y="${T - 10}" class="gtx gsm">By day</text>`;
  $('gBox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="gsvg">${s}</svg><p class="note">${exact} incidents with an exact hour${gSpread ? `, ${spread} with only a part of day (spread evenly across its hours)` : ''}; ${ev.length - exact - (gSpread ? spread : 0)} more did not say when. Click a cell to see its incidents.</p>`;
  $('gBox').querySelectorAll('.gcell').forEach(el => el.onclick = () => { const d = +el.dataset.d, h = +el.dataset.h; gPickSet(`${DAYS7[d]} ${String(h).padStart(2, '0')}:00`, who[d][h]); });
}

/* Trend: weekly counts and the four-week average. */
function gTrend() {
  const ev = gEv(), wk = {};
  const monday = d => { const t = new Date(d.slice(0, 10) + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7); return t.toISOString().slice(0, 10); };
  for (const e of ev) (wk[monday(e.d)] = wk[monday(e.d)] || []).push(e);
  const first = Object.keys(wk).sort()[0];
  if (!first) { $('gBox').innerHTML = '<div class="empty">No incidents in this view and period.</div>'; return; }
  const weeks = []; for (let t = new Date(first + 'T00:00:00Z'); t <= new Date(); t.setUTCDate(t.getUTCDate() + 7)) weeks.push(t.toISOString().slice(0, 10));
  const n = weeks.map(w => (wk[w] || []).length), max = Math.max(1, ...n), W = 960, L = 40, B = 40, T = 20, H = 300, bw = (W - L - 10) / weeks.length;
  const y = v => T + (H - T - B) * (1 - v / max);
  let s = '';
  [0, .5, 1].forEach(f => { const v = Math.round(max * f); s += `<line x1="${L}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" class="grule"/><text x="${L - 6}" y="${y(v) + 4}" class="gtx gsm" text-anchor="end">${v}</text>`; });
  weeks.forEach((w, i) => {
    s += `<rect x="${L + i * bw + 1}" y="${y(n[i])}" width="${Math.max(1, bw - 2)}" height="${H - B - y(n[i])}" class="gfill gbarw" fill-opacity=".45" data-i="${i}"${tip(`Week of ${fmtDay(w + 'T06:30:00Z')} · ${n[i]} incidents`)}/>`;
    if (i % Math.ceil(weeks.length / 8) === 0) s += `<text x="${L + i * bw + bw / 2}" y="${H - B + 16}" class="gtx gsm" text-anchor="middle">${fmtDay(w + 'T06:30:00Z')}</text>`;
  });
  const avg = n.map((_, i) => { const a = n.slice(Math.max(0, i - 3), i + 1); return a.reduce((p, q) => p + q, 0) / a.length; });
  s += `<polyline points="${avg.map((v, i) => `${L + i * bw + bw / 2},${y(v)}`).join(' ')}" class="gline"/>`;
  $('gBox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="gsvg">${s}</svg><p class="note">Bars: incidents per week. Line: four-week average. Click a week to see its incidents.</p>`;
  $('gBox').querySelectorAll('.gbarw').forEach(el => el.onclick = () => { const i = +el.dataset.i; gPickSet('Week of ' + fmtDay(weeks[i] + 'T06:30:00Z'), wk[weeks[i]] || []); });
}

/* Where × what: the busiest areas of this view against the types. */
function gMatrix() {
  const ev = gEv(false).filter(e => e.a), byA = {};
  for (const e of ev) (byA[e.a] = byA[e.a] || []).push(e);
  const areas = Object.keys(byA).sort((p, q) => byA[q].length - byA[p].length).slice(0, 16);
  const types = CATS.filter(c => ev.some(e => e.c === c.id));
  if (!areas.length) { $('gBox').innerHTML = '<div class="empty">No placed incidents in this view and period.</div>'; return; }
  const cell = (a, c) => byA[a].filter(e => e.c === c);
  const max = Math.max(1, ...areas.flatMap(a => types.map(t => cell(a, t.id).length)));
  const L = 170, T = 110, cw = Math.min(64, (960 - L - 60) / types.length), ch = 26, W = L + types.length * cw + 60, H = T + areas.length * ch + 10;
  let s = '';
  types.forEach((t, j) => { s += `<text transform="translate(${L + j * cw + cw / 2},${T - 8}) rotate(-38)" class="gtx gsm">${esc(t.name.replace(' & ', ' & ').split(' (')[0])}</text>`; });
  areas.forEach((a, i) => {
    s += `<text x="${L - 8}" y="${T + i * ch + ch / 2 + 4}" class="gtx" text-anchor="end">${esc(AREA[a].name)}</text>`;
    types.forEach((t, j) => { const v = cell(a, t.id).length; s += `<rect x="${L + j * cw + 1}" y="${T + i * ch + 1}" width="${cw - 2}" height="${ch - 2}" class="gfill gcell" fill-opacity="${gBin(v, max)}" data-a="${a}" data-c="${t.id}"${tip(`${AREA[a].name} · ${t.name}: ${v}`)}/>${v ? `<text x="${L + j * cw + cw / 2}" y="${T + i * ch + ch / 2 + 4}" class="gtx gsm gnum" text-anchor="middle">${v}</text>` : ''}`; });
    s += `<text x="${L + types.length * cw + 8}" y="${T + i * ch + ch / 2 + 4}" class="gtx gsm">${byA[a].length}</text>`;
  });
  $('gBox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="gsvg">${s}</svg><p class="note">The ${areas.length} areas with most incidents in this view and period; the number at the end of a row is the area’s total. Click a cell to see its incidents.</p>`;
  $('gBox').querySelectorAll('.gcell').forEach(el => el.onclick = () => gPickSet(`${AREA[el.dataset.a].name} · ${CAT[el.dataset.c].name}`, cell(el.dataset.a, el.dataset.c)));
}

/* Calendar: every day, with festivals marked. */
function gCalendar() {
  const ev = gEv(), byD = {};
  for (const e of ev) (byD[dayKey(e)] = byD[dayKey(e)] || []).push(e);
  const keys = Object.keys(byD).sort();
  if (!keys.length) { $('gBox').innerHTML = '<div class="empty">No incidents in this view and period.</div>'; return; }
  const start = new Date(keys[0] + 'T00:00:00Z'); start.setUTCDate(start.getUTCDate() - (start.getUTCDay() + 6) % 7);
  const end = new Date(istDay(Date.now()) + 'T00:00:00Z'), days = [];
  for (let t = new Date(start); t <= end; t.setUTCDate(t.getUTCDate() + 1)) days.push(t.toISOString().slice(0, 10));
  const max = Math.max(1, ...days.map(d => (byD[d] || []).length)), c = 15, L = 40, T = 24, weeks = Math.ceil(days.length / 7);
  const W = Math.max(600, L + weeks * c + 20), H = T + 7 * c + 70;
  let s = '', lastMonth = '';
  days.forEach((d, i) => {
    const x = L + Math.floor(i / 7) * c, yy = T + (i % 7) * c, v = (byD[d] || []).length;
    s += `<rect x="${x + 1}" y="${yy + 1}" width="${c - 2}" height="${c - 2}" class="gfill gday" fill-opacity="${gBin(v, max)}" data-d="${d}"${tip(`${fmtDay(d + 'T06:30:00Z')} (${DAYS7[i % 7]}) · ${v} incident${v === 1 ? '' : 's'}`)}/>`;
    if (d.slice(0, 7) !== lastMonth && i % 7 === 0) { lastMonth = d.slice(0, 7); s += `<text x="${x}" y="${T - 8}" class="gtx gsm">${new Date(d + 'T06:30:00Z').toLocaleDateString('en-IN', { month: 'short' })}</text>`; }
  });
  [0, 2, 4, 6].forEach(r => { s += `<text x="${L - 6}" y="${T + r * c + 11}" class="gtx gsm" text-anchor="end">${DAYS7[r]}</text>`; });
  FESTIVALS.forEach(([a, b, name], k) => {
    const i0 = days.indexOf(a), i1 = days.indexOf(b);
    if (i0 < 0 && i1 < 0) return;
    const x0 = L + Math.floor(Math.max(0, i0) / 7) * c, x1 = L + Math.floor((i1 < 0 ? days.length - 1 : i1) / 7) * c + c, yy = T + 7 * c + 10 + (k % 2) * 22;
    s += `<line x1="${x0}" x2="${x1}" y1="${yy}" y2="${yy}" class="gfest"/><text x="${x0}" y="${yy + 14}" class="gtx gsm">${name}</text>`;
  });
  $('gBox').innerHTML = `<div class="gscroll"><svg viewBox="0 0 ${W} ${H}" class="gsvg" style="min-width:${Math.min(W, 900)}px">${s}</svg></div><p class="note">Each square is a day; darker means more incidents. Lines under the grid mark festivals. Click a day to see its incidents.</p>`;
  $('gBox').querySelectorAll('.gday').forEach(el => el.onclick = () => gPickSet(fmtDay(el.dataset.d + 'T06:30:00Z'), byD[el.dataset.d] || []));
}

/* Concentration: the 80-20 check across the areas of this view (areas with no incidents count too). */
function gConc() {
  const ev = gEv().filter(e => e.a), cnt = {};
  for (const e of ev) cnt[e.a] = (cnt[e.a] || 0) + 1;
  const areas = AREAS.filter(a => areaInView(a.id)), n = areas.map(a => cnt[a.id] || 0).sort((p, q) => q - p), tot = n.reduce((p, q) => p + q, 0);
  if (!tot || areas.length < 3) { $('gBox').innerHTML = '<div class="empty">Too few placed incidents or areas in this view.</div>'; return; }
  const pts = [[0, 0]]; let acc = 0; n.forEach((v, i) => { acc += v; pts.push([(i + 1) / n.length, acc / tot]); });
  const k = Math.max(1, Math.round(n.length * 0.2)), topShare = n.slice(0, k).reduce((p, q) => p + q, 0) / tot;
  const W = 640, H = 420, L = 60, B = 50, T = 20, R = 20, X = f => L + f * (W - L - R), Y = f => H - B - f * (H - B - T);
  let s = `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(1)}" y2="${Y(1)}" class="grule" stroke-dasharray="4 4"/>`;
  [0, .2, .4, .6, .8, 1].forEach(f => { s += `<text x="${X(f)}" y="${H - B + 18}" class="gtx gsm" text-anchor="middle">${f * 100}%</text><text x="${L - 8}" y="${Y(f) + 4}" class="gtx gsm" text-anchor="end">${f * 100}%</text>`; });
  s += `<polygon points="${pts.map(([x, y]) => `${X(x)},${Y(y)}`).join(' ')} ${X(1)},${Y(0)}" class="gfill" fill-opacity=".12"/><polyline points="${pts.map(([x, y]) => `${X(x)},${Y(y)}`).join(' ')}" class="gline"/>`;
  s += `<line x1="${X(k / n.length)}" x2="${X(k / n.length)}" y1="${Y(0)}" y2="${Y(topShare)}" class="grule"/><circle cx="${X(k / n.length)}" cy="${Y(topShare)}" r="5" class="gfill"/>`;
  s += `<text x="${X(0.5)}" y="${H - 8}" class="gtx gsm" text-anchor="middle">Share of areas, busiest first</text><text transform="translate(16,${Y(0.5)}) rotate(-90)" class="gtx gsm" text-anchor="middle">Share of incidents</text>`;
  const busiest = areas.map(a => [a.name, cnt[a.id] || 0]).sort((p, q) => q[1] - p[1]).slice(0, k);
  $('gBox').innerHTML = `<p class="say" style="margin:6px 0 10px">The busiest <b>${k}</b> of ${n.length} areas (20%) hold <em>${Math.round(topShare * 100)}%</em> of placed incidents${gType ? ' of this type' : ''}: ${busiest.map(([nm, v]) => `${esc(nm)} ${v}`).join(', ')}.</p><svg viewBox="0 0 ${W} ${H}" class="gsvg" style="max-width:640px">${s}</svg><p class="note">If incidents were spread evenly, the curve would follow the dashed line. Areas differ in size and population, so this measures where incidents are reported, not risk per person.</p>`;
}

/* Harm: fatal, injured and not stated for each type. */
function gHarm() {
  const ev = gEv(false), rows = CATS.map(c => { const xs = ev.filter(e => e.c === c.id); return { c, n: xs.length, f: xs.filter(e => e.o === 'fatal'), i: xs.filter(e => e.o === 'injured') }; }).filter(r => r.n)
    .sort((p, q) => q.f.length / q.n - p.f.length / p.n || q.n - p.n);
  if (!rows.length) { $('gBox').innerHTML = '<div class="empty">No incidents in this view and period.</div>'; return; }
  const L = 220, W = 960, ch = 30, T = 30, H = T + rows.length * ch + 30, bw = W - L - 120;
  let s = `<text x="${L}" y="16" class="gtx gsm">■ fatal   ▪ injured   □ not stated</text>`;
  rows.forEach((r, k) => {
    const y = T + k * ch, f = r.f.length / r.n * bw, i = r.i.length / r.n * bw;
    s += `<text x="${L - 10}" y="${y + ch / 2 + 4}" class="gtx" text-anchor="end">${esc(r.c.name)}</text>
      <rect x="${L}" y="${y + 6}" width="${bw}" height="${ch - 12}" class="grest"/>
      <rect x="${L}" y="${y + 6}" width="${f}" height="${ch - 12}" class="gfill gh" data-k="${k}" data-o="f"${tip(`${r.c.name}: ${r.f.length} of ${r.n} fatal (${Math.round(r.f.length / r.n * 100)}%)`)}/>
      <rect x="${L + f}" y="${y + 6}" width="${i}" height="${ch - 12}" class="gfill gh" fill-opacity=".4" data-k="${k}" data-o="i"${tip(`${r.c.name}: ${r.i.length} of ${r.n} injured someone (${Math.round(r.i.length / r.n * 100)}%)`)}/>
      <text x="${L + bw + 10}" y="${y + ch / 2 + 4}" class="gtx gsm">${r.f.length} fatal · ${r.i.length} injured · ${r.n}</text>`;
  });
  $('gBox').innerHTML = `<svg viewBox="0 0 ${W} ${H}" class="gsvg">${s}</svg><p class="note">Sorted by the share that were fatal. "Not stated" means the report did not say anyone died or was hurt. Click a bar to see its incidents.</p>`;
  $('gBox').querySelectorAll('.gh').forEach(el => el.onclick = () => { const r = rows[+el.dataset.k]; gPickSet(`${r.c.name} · ${el.dataset.o === 'f' ? 'fatal' : 'injured'}`, el.dataset.o === 'f' ? r.f : r.i); });
}

// Controls and the hover tooltip.
document.addEventListener('click', e => {
  const b = e.target.closest('[data-gs]'); if (b) { gSel = b.dataset.gs; gPick = null; drawGraphs(); }
  const m = e.target.closest('[data-anm]'); if (m) { anMode = m.dataset.anm; gPick = null; drawAn(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'gType') { gType = e.target.value; gPick = null; drawGraphs(); }
  if (e.target.id === 'gSpread') { gSpread = e.target.checked; gPick = null; drawGraphs(); }
});
document.addEventListener('mousemove', e => {
  const t = $('gTip'), el = e.target.closest && e.target.closest('[data-tip]');
  if (!el || !$('anBody').contains(el)) { t.style.display = 'none'; return; }
  t.textContent = el.dataset.tip; t.style.display = 'block';
  t.style.left = Math.min(innerWidth - t.offsetWidth - 8, e.clientX + 14) + 'px'; t.style.top = (e.clientY + 16) + 'px';
});

/* ---------- Wiring ---------- */
$('fCat').innerHTML = '<option value="">All types</option>' + CATS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
drawPeriod();
drawViews();
for (const id of ['fCat', 'fTime']) $(id).onchange = drawMap;
function show(tab) {
  for (const [b, v] of [['tabNews', 'news'], ['tabMap', 'map'], ['tabSit', 'sit'], ['tabOc', 'oc'], ['tabAn', 'an']]) {
    $(b).classList.toggle('on', tab === v);
    if (tab === v) { const row = $(b).parentElement; row.scrollLeft = $(b).offsetLeft - (row.clientWidth - $(b).offsetWidth) / 2; }
  }
  $('news').classList.toggle('hide', tab !== 'news'); $('mapv').classList.toggle('hide', tab !== 'map'); $('sitv').classList.toggle('hide', tab !== 'sit');
  $('ocv').classList.toggle('hide', tab !== 'oc');
  if (tab === 'sit') drawSits();
  $('anv').classList.toggle('hide', tab !== 'an');
  if (tab === 'oc') drawOc();
  if (tab === 'an') drawAn();
  if (tab === 'map') { const first = !MAP; drawMap(); setTimeout(() => { MAP.invalidateSize(); if (first) fitView(); }, 80); }
  scanTab = tab; drawScan();
  try { history.replaceState(null, '', '#' + tab); } catch {}
}
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  if (save) try { localStorage.setItem('vidraksh-theme', t); } catch {}
  $('themeSwitch').setAttribute('aria-checked', t === 'dark');
  $('themeWord').textContent = t === 'dark' ? 'Dark' : 'Light';
  $('themeColor').content = t === 'dark' ? '#131313' : '#E6E6E6';
  if (MAP) { setBase(); if (!$('mapv').classList.contains('hide')) drawMap(); }
}
$('themeSwitch').onclick = () => applyTheme(isDarkTheme() ? 'light' : 'dark', true);
applyTheme(document.documentElement.dataset.theme, false);
$('tabNews').onclick = () => show('news');
$('tabMap').onclick = () => show('map');
$('tabSit').onclick = () => show('sit');
$('tabOc').onclick = () => show('oc');
$('tabAn').onclick = () => show('an');
await load();
show({ '#map': 'map', '#sit': 'sit', '#oc': 'oc', '#an': 'an' }[location.hash] || 'news');
</script>
