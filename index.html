<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" id="themeColor" content="#E6E6E6">
<script>
// Decide the theme before first paint: the saved choice, else the device setting.
(function(){var t;try{t=localStorage.getItem('vidraksh-theme')}catch(e){}
if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t;})();
</script>
<title>विद्रक्ष · Live · Pune</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23E6E6E6'/%3E%3Crect x='8' y='15' width='16' height='2' fill='%239C5A2B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Tiro+Devanagari+Marathi&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root{
  --paper:#E6E6E6; --raised:#EFEFEF; --ink:#181818; --ink-2:#4A4A4A; --ink-3:#7C7C7C; --rule:#CFCFCF;
  --copper:#9C5A2B; --copper-text:#8A4D22; --copper-wash:rgba(156,90,43,.14);
  --sans:"Mukta",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Newsreader","Tiro Devanagari Marathi",Georgia,serif;
}
:root[data-theme="dark"]{
  --paper:#131313; --raised:#1B1B1B; --ink:#ECECEC; --ink-2:#B4B4B4; --ink-3:#808080; --rule:#2E2E2E;
  --copper:#C98652; --copper-text:#D2925F; --copper-wash:rgba(201,134,82,.16);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* Masthead */
.mast{position:relative;text-align:center;padding:30px 20px 18px}
.switch{position:absolute;top:16px;right:18px;appearance:none;background:none;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
.switch i{display:block;position:relative;width:30px;height:16px;border:1px solid var(--ink-3);border-radius:8px;transition:border-color .2s}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--ink-3);transition:transform .2s,background .2s}
:root[data-theme="dark"] .switch i{border-color:var(--copper)}
:root[data-theme="dark"] .switch i::after{transform:translateX(14px);background:var(--copper)}
.switch:focus-visible{outline:1px solid var(--copper);outline-offset:2px}
.mark{font-size:38px;font-weight:500;line-height:1.15;letter-spacing:.01em;margin:0}
.mark span{color:var(--copper)}
.mast hr{width:38px;height:1px;border:0;background:var(--copper);margin:9px auto 11px}
.kicker{font-size:11px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--ink-2);padding-left:.32em}
#stamp{font-size:13px;color:var(--ink-3);margin-top:7px}

/* Tabs */
nav{position:sticky;top:0;z-index:1000;background:var(--paper);border-bottom:1px solid var(--rule)}
nav div{display:flex;justify-content:center;gap:34px}
nav button{appearance:none;background:none;border:0;padding:13px 0 11px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid transparent;margin-bottom:-1px;cursor:pointer}
nav button.on{color:var(--ink);border-bottom-color:var(--copper)}

.label{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}

/* News */
.filter{display:flex;gap:20px;overflow-x:auto;padding:16px 0 12px;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.filter::-webkit-scrollbar{display:none}
.filter button{flex:none;appearance:none;background:none;border:0;padding:0 0 3px;font-size:14px;color:var(--ink-3);border-bottom:1px solid transparent;white-space:nowrap;cursor:pointer}
.filter button.on{color:var(--ink);border-bottom-color:var(--copper)}
.day{display:flex;align-items:center;gap:12px;margin:26px 0 2px}
.day::after{content:"";flex:1;height:1px;background:var(--rule)}
.item{padding:15px 0 16px;border-bottom:1px solid var(--rule)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cat{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--copper-text)}
.when{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.head{display:block;font-family:var(--serif);font-size:20px;line-height:1.28;font-weight:400;text-decoration:none;margin:5px 0 6px;text-wrap:pretty}
.head:hover{text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:3px;text-decoration-thickness:1px}
.by{font-size:13px;color:var(--ink-3)}
.by b{font-weight:500;color:var(--ink-2)}
.by a{text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.more{display:block;margin:22px auto 0;appearance:none;background:none;border:1px solid var(--rule);padding:9px 22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
.empty{padding:44px 0;text-align:center;color:var(--ink-3);font-family:var(--serif);font-size:17px}

/* Map */
.mapgrid{max-width:1180px;margin:0 auto;padding:0 20px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px 0 8px}
.controls label{display:block}
select{width:100%;appearance:none;background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:5px 16px 6px 0;font-size:14.5px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 7px) 55%,calc(100% - 3px) 55%;background-size:4px 4px;background-repeat:no-repeat}
select:focus{outline:0;border-bottom-color:var(--copper)}
option{background:var(--paper);color:var(--ink)}
.tog{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);padding:6px 0 12px;cursor:pointer}
.tog input{accent-color:var(--copper);margin:0}
#map{height:50vh;min-height:320px;background:var(--raised);border:1px solid var(--rule);z-index:1}
.count{font-size:13.5px;color:var(--ink-2);margin:10px 0 0}
.count b{font-weight:600;color:var(--ink)}
.sec{padding:22px 0 4px;border-top:1px solid var(--rule);margin-top:22px}
.sec h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:6px 0 12px}
.sec h3{margin:0 0 8px}
.two{display:grid;grid-template-columns:1fr;gap:20px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 30px;column-gap:10px;align-items:baseline;font-size:14px;padding:5px 0 0}
.row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.row .track{grid-column:1/-1;height:2px;background:var(--rule);margin-top:4px}
.row .track i{display:block;height:2px;background:var(--copper)}
.say{font-family:var(--serif);font-size:17.5px;line-height:1.38;margin:0 0 10px;text-wrap:pretty}
.say b{font-weight:500}
.say em{font-style:normal;color:var(--copper-text)}
.note{font-size:13px;color:var(--ink-3);margin:8px 0 0}
.mini{font-size:13.5px;color:var(--ink-2);padding:7px 0;border-top:1px solid var(--rule)}
.mini a{text-decoration:none;color:var(--ink)}
.mini a:hover{text-decoration:underline;text-decoration-color:var(--copper)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--rule);font-weight:400}
th{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
td:first-child,th:first-child{text-align:left;padding-left:0}
td.hi{color:var(--copper-text);font-weight:600}
td.z{color:var(--rule)}
.src{font-size:13.5px;color:var(--ink-2);padding:5px 0;display:flex;justify-content:space-between;gap:12px}
.src span:last-child{color:var(--ink-3);text-align:right}
.src.off span:first-child{color:var(--ink-3);text-decoration:line-through}
.hide{display:none}
footer{max-width:680px;margin:40px auto 0;padding:18px 20px 48px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3);text-align:center}

/* Leaflet, restrained */
.leaflet-container{font-family:var(--sans);background:var(--raised)}
.leaflet-bar{border:1px solid var(--rule)!important;box-shadow:none!important;border-radius:0!important}
.leaflet-bar a{background:var(--paper)!important;color:var(--ink)!important;border-bottom:1px solid var(--rule)!important;border-radius:0!important;width:30px!important;height:30px!important;line-height:28px!important;font-weight:400}
.leaflet-control-attribution{background:color-mix(in srgb,var(--paper) 80%,transparent)!important;color:var(--ink-3)!important;font-size:10px!important}
.leaflet-control-attribution a{color:var(--ink-2)!important}
.lbl{background:none!important;border:0!important;box-shadow:none!important;color:var(--ink)!important;font:600 12px var(--sans);padding:0!important}
.lbl::before{display:none!important}

@media (min-width:960px){
  .mast{padding-top:40px}
  .mark{font-size:46px}
  .mapgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:start}
  .mapcol{position:sticky;top:60px}
  #map{height:calc(100vh - 190px)}
  .sidecol .sec:first-child{border-top:0;margin-top:0;padding-top:16px}
}
</style>
</head>
<body>
<header class="mast">
  <button class="switch" id="themeSwitch" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span id="themeWord">Light</span><i></i></button>
  <h1 class="mark" lang="mr" aria-label="Vidraksh">विद्र<span>क्ष</span></h1>
  <hr>
  <div class="kicker">Live · Pune</div>
  <div id="stamp">Loading</div>
</header>

<nav><div>
  <button id="tabNews" class="on">Reports</button>
  <button id="tabMap">Map &amp; patterns</button>
</div></nav>

<main id="news" class="wrap">
  <div class="filter" id="newsFilter"></div>
  <div id="newsList"></div>
</main>

<main id="mapv" class="hide">
  <div class="mapgrid">
    <div class="mapcol">
      <div class="controls">
        <label><span class="label">Period</span>
          <select id="fPeriod"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option><option value="0" selected>All history</option></select></label>
        <label><span class="label">Type</span><select id="fCat"></select></label>
        <label><span class="label">Time</span>
          <select id="fTime"><option value="">Any time</option><option value="dark">After dark</option><option value="morning">Morning</option><option value="afternoon">Afternoon</option><option value="evening">Evening</option><option value="night">Night</option></select></label>
      </div>
      <label class="tog"><input type="checkbox" id="fWide" checked> Include Pimpri-Chinchwad and the wider district</label>
      <div id="map"></div>
      <p class="count" id="count"></p>
    </div>
    <div class="sidecol">
      <div id="areaBox"></div>
      <div id="patterns"></div>
      <section class="sec"><h3 class="label">Sources</h3><div id="sources"></div></section>
    </div>
  </div>
</main>

<footer>
  Compiled from public news reports; every headline links to its publisher. Areas and types are read from the report by rule, so a few will be wrong.
  This reflects what the press reported, not all crime.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script type="module">
import { AREAS, CATS, FEEDS, groupEvents } from './collector/engine.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
const SRC = Object.fromEntries(FEEDS.map(f => [f.id, f.name]));
const BANDS = ['morning', 'afternoon', 'evening', 'night'];
const BAND_NAME = { morning: 'Morning · 6am–12', afternoon: 'Afternoon · 12–5pm', evening: 'Evening · 5–9pm', night: 'Night · 9pm–6am' };
const isDarkTheme = () => document.documentElement.dataset.theme === 'dark';
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const IST = 19800000;
const istDay = d => new Date(new Date(d).getTime() + IST).toISOString().slice(0, 10);
const fmtDay = d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'Asia/Kolkata' });
const ago = d => { const m = (Date.now() - new Date(d)) / 60000; return m < 60 ? Math.max(1, m | 0) + ' min ago' : m < 1440 ? (m / 60 | 0) + ' h ago' : fmtDay(d); };
const isDark = e => e.h != null ? (e.h >= 19 || e.h < 6) : e.b === 'night';
const link = (r, text) => `<a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${text}</a>`;

let ITEMS = [], STATUS = null, EVENTS = [];
const bust = '?t=' + Date.now();
const j = async u => { const r = await fetch(u + bust, { cache: 'no-store' }); if (!r.ok) throw 0; return r.json(); };

async function load() {
  try { ITEMS = await j('data/incidents.json'); } catch { ITEMS = []; }
  try { STATUS = await j('data/status.json'); } catch { STATUS = null; }
  if (/^(localhost|127\.)/.test(location.hostname) && location.search === '?test') {   // local layout testing only
    try { ITEMS = await j('_samples/test.json'); } catch {}
  }
  ITEMS = ITEMS.filter(r => CAT[r.c]);
  EVENTS = groupEvents(ITEMS).sort((x, y) => (x.last < y.last ? 1 : -1));
  $('stamp').textContent = ITEMS.length
    ? `${EVENTS.length} incidents from ${ITEMS.length} reports, since ${fmtDay(ITEMS[ITEMS.length - 1].d)}` + (STATUS ? ` · checked ${ago(STATUS.updated)}` : '')
    : 'Nothing collected yet. The collector runs every hour.';
  drawNews(); drawSources();
}

/* ---------- Reports ---------- */
let newsCat = '', newsN = 60;
function drawNews() {
  const used = new Set(EVENTS.map(e => e.c));
  $('newsFilter').innerHTML = `<button class="${newsCat ? '' : 'on'}" data-c="">All</button>` +
    CATS.filter(c => used.has(c.id)).map(c => `<button class="${newsCat === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  const rows = EVENTS.filter(e => !newsCat || e.c === newsCat);
  if (!rows.length) { $('newsList').innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
  const today = istDay(Date.now()), yest = istDay(Date.now() - 864e5);
  let html = '', day = '';
  for (const e of rows.slice(0, newsN)) {
    const d = istDay(e.last);
    if (d !== day) { day = d; html += `<div class="day label">${d === today ? 'Today' : d === yest ? 'Yesterday' : fmtDay(e.last)}</div>`; }
    const rs = [...e.reports].sort((x, y) => (x.d < y.d ? 1 : -1)), r = rs[0];
    const others = rs.slice(1).filter((x, i, a) => a.findIndex(y => y.s === x.s) === i && x.s !== r.s);
    html += `<article class="item">
      <div class="top"><span class="cat">${esc(CAT[e.c].name)}</span><span class="when">${ago(e.last)}</span></div>
      ${link(r, esc(r.t)).replace('<a ', '<a class="head" ')}
      <div class="by"><b>${e.a ? esc(AREA[e.a].name) : 'Area not stated'}</b> · ${esc(SRC[r.s] || r.s)}${others.length ? ' · also ' + others.map(x => link(x, esc(SRC[x.s] || x.s))).join(', ') : ''}</div>
    </article>`;
  }
  if (rows.length > newsN) html += '<button class="more" id="more">Show earlier</button>';
  $('newsList').innerHTML = html;
}
$('newsFilter').onclick = e => { const b = e.target.closest('button'); if (b) { newsCat = b.dataset.c; newsN = 60; drawNews(); } };
$('newsList').onclick = e => { if (e.target.id === 'more') { newsN += 60; drawNews(); } };

/* ---------- Map ---------- */
let MAP, LAYER, BASE, picked = null;
function initMap() {
  MAP = L.map('map', { zoomControl: true, scrollWheelZoom: false }).setView([18.53, 73.86], 11);
  MAP.attributionControl.setPrefix(false);
  setBase();
  LAYER = L.layerGroup().addTo(MAP);
}
function setBase() {
  if (BASE) { MAP.removeLayer(BASE); BASE = null; }
  try {
    if (window.maplibregl && L.maplibreGL) BASE = L.maplibreGL({ style: 'https://tiles.openfreemap.org/styles/' + (isDarkTheme() ? 'dark' : 'positron'), attribution: '© OpenFreeMap · OpenMapTiles · OpenStreetMap' }).addTo(MAP);
  } catch {}
  if (!BASE) BASE = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(MAP);
}

function current() {
  const days = +$('fPeriod').value, cat = $('fCat').value, t = $('fTime').value, wide = $('fWide').checked;
  const since = days ? Date.now() - days * 864e5 : 0;
  return EVENTS.filter(e =>
    new Date(e.last) >= since && (!cat || e.c === cat) &&
    (!t || (t === 'dark' ? isDark(e) : e.b === t)) &&
    (wide || !e.a || AREA[e.a].r === 'city'));
}
const tally = (list, key) => { const m = {}; for (const x of list) { const k = key(x); if (k != null) m[k] = (m[k] || 0) + 1; } return m; };
const top = (m, n) => Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, n);
const rowsOf = (pairs, label) => { const mx = Math.max(1, ...pairs.map(p => p[1])); return pairs.map(([k, v]) => `<div class="row"><span>${esc(label(k))}</span><span class="n">${v}</span><div class="track"><i style="width:${v / mx * 100}%"></i></div></div>`).join(''); };

function drawMap() {
  if (!MAP) initMap();
  const ev = current(), placed = ev.filter(e => e.a), copper = css('--copper');
  LAYER.clearLayers();
  const per = {};
  for (const e of placed) (per[e.a] = per[e.a] || []).push(e);
  if (picked && !per[picked]) picked = null;
  for (const [id, list] of Object.entries(per)) {
    const a = AREA[id], on = id === picked;
    L.circleMarker([a.lat, a.lon], { radius: 9 + Math.sqrt(list.length) * 4, color: copper, weight: on ? 2 : 1, fillColor: copper, fillOpacity: on ? .5 : .2 })
      .bindTooltip(String(list.length), { permanent: true, direction: 'center', className: 'lbl' })
      .on('click', () => { picked = id; drawMap(); if (innerWidth < 960) $('areaBox').scrollIntoView({ behavior: 'smooth', block: 'start' }); })
      .addTo(LAYER);
  }
  const none = ev.length - placed.length;
  $('count').innerHTML = `<b>${ev.length}</b> incidents · <b>${placed.length}</b> placed across ${Object.keys(per).length} areas${none ? ` · ${none} with no area stated` : ''}. Each circle is an area total at the locality centre, never the spot of an incident.`;
  drawArea(); drawPatterns(ev);
}

function drawArea() {
  if (!picked) { $('areaBox').innerHTML = `<section class="sec"><h3 class="label">Area</h3><p class="note" style="margin-top:0">Select a circle on the map to see that area.</p></section>`; return; }
  const list = current().filter(e => e.a === picked), timed = list.filter(e => e.b);
  $('areaBox').innerHTML = `<section class="sec"><h3 class="label">Area</h3>
    <h2>${esc(AREA[picked].name)}</h2>
    <div class="two">
      <div><div class="label">By type · ${list.length}</div>${rowsOf(top(tally(list, e => e.c), 12), k => CAT[k].name)}</div>
      <div><div class="label">By time of day</div>${timed.length ? rowsOf(BANDS.map(b => [b, timed.filter(e => e.b === b).length]), k => BAND_NAME[k]) : ''}
        <p class="note">${timed.length ? `${list.length - timed.length} of ${list.length} did not state a time.` : 'No report here stated a time of day.'}</p></div>
    </div>
    <div style="margin-top:18px">${[...list].sort((x, y) => (x.last < y.last ? 1 : -1)).slice(0, 8).map(e => `<div class="mini">${fmtDay(e.last)} · ${esc(CAT[e.c].name)}<br>${link(e.reports[0], esc(e.reports[0].t))}${e.reports.length > 1 ? ` <span style="color:var(--ink-3)">· ${e.reports.length} reports</span>` : ''}</div>`).join('')}</div>
  </section>`;
}

/* ---------- Patterns ---------- */
function drawPatterns(ev) {
  const placed = ev.filter(e => e.a), out = [];
  const sec = (title, body) => `<section class="sec"><h3 class="label">${title}</h3>${body}</section>`;
  if (placed.length < 25) {
    $('patterns').innerHTML = sec('Patterns', `<p class="say">Too early to say. ${placed.length} placed incidents in this view; patterns are shown from about 25, so that areas can be compared fairly.</p><p class="note">The history grows every hour.</p>`);
    return;
  }
  const byCat = {}, byArea = {};
  for (const e of placed) { (byCat[e.c] = byCat[e.c] || []).push(e); (byArea[e.a] = byArea[e.a] || []).push(e); }

  const conc = CATS.filter(c => (byCat[c.id] || []).length >= 5).map(c => {
    const t = top(tally(byCat[c.id], e => e.a), 3);
    return `<p class="say"><b>${esc(c.name)}</b> is reported most in ${t.map(([a, n]) => `${esc(AREA[a].name)} <em>${n}</em>`).join(', ')}.</p>`;
  });
  if (conc.length) out.push(sec('Where each type concentrates', conc.join('')));

  const share = tally(placed, e => e.c), lifts = [];
  for (const [a, list] of Object.entries(byArea)) {
    if (list.length < 8) continue;
    for (const [c, n] of Object.entries(tally(list, e => e.c))) {
      const here = n / list.length, city = share[c] / placed.length;
      if (n >= 4 && here >= city * 1.6) lifts.push({ a, c, n, here, city, x: here / city });
    }
  }
  lifts.sort((p, q) => q.x - p.x);
  out.push(sec('What stands out by area', lifts.length ? lifts.slice(0, 8).map(l =>
    `<p class="say"><b>${esc(AREA[l.a].name)}</b>: ${esc(CAT[l.c].name.toLowerCase())} is <em>${Math.round(l.here * 100)}%</em> of incidents here (${l.n} of ${byArea[l.a].length}), against ${Math.round(l.city * 100)}% across all areas.</p>`).join('')
    : '<p class="note" style="margin-top:0">No area yet has enough incidents (8, with 4 of one type) to say what is unusual about it.</p>'));

  const night = Object.entries(byArea).map(([a, list]) => { const t = list.filter(e => e.b); return { a, t: t.length, d: t.filter(isDark).length }; }).filter(x => x.t >= 5).sort((p, q) => q.d / q.t - p.d / p.t);
  out.push(sec('After dark · 7pm–6am', (night.length ? night.slice(0, 8).map(x =>
    `<p class="say"><b>${esc(AREA[x.a].name)}</b>: <em>${Math.round(x.d / x.t * 100)}%</em> after dark (${x.d} of ${x.t} with a stated time).</p>`).join('')
    : '<p class="note" style="margin-top:0">No area yet has 5 incidents with a stated time.</p>')));

  const rows = CATS.filter(c => ev.some(e => e.c === c.id)).map(c => {
    const l = ev.filter(e => e.c === c.id), v = BANDS.map(b => l.filter(e => e.b === b).length), mx = Math.max(...v);
    return `<tr><td>${esc(c.name)}</td>${v.map(n => `<td class="${n && n === mx ? 'hi' : n ? '' : 'z'}">${n || '–'}</td>`).join('')}<td class="${l.some(e => !e.b) ? '' : 'z'}">${l.filter(e => !e.b).length || '–'}</td></tr>`;
  });
  out.push(sec('Type by time of day', `<table><tr><th></th><th>Morn</th><th>Aft</th><th>Eve</th><th>Night</th><th>n/s</th></tr>${rows.join('')}</table><p class="note">n/s: the report did not state a time.</p>`));
  $('patterns').innerHTML = out.join('');
}

function drawSources() {
  $('sources').innerHTML = STATUS
    ? STATUS.sources.map(s => `<div class="src ${s.ok ? '' : 'off'}"><span>${esc(s.name)}</span><span>${s.ok ? `${s.found} incident items in feed` : 'not reachable'}</span></div>`).join('') + `<p class="note">Last checked ${new Date(STATUS.updated).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}.</p>`
    : '<p class="note" style="margin-top:0">No collector run recorded yet.</p>';
}

/* ---------- Wiring ---------- */
$('fCat').innerHTML = '<option value="">All types</option>' + CATS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
for (const id of ['fPeriod', 'fCat', 'fTime', 'fWide']) $(id).onchange = drawMap;
function show(tab) {
  $('tabNews').classList.toggle('on', tab === 'news'); $('tabMap').classList.toggle('on', tab === 'map');
  $('news').classList.toggle('hide', tab !== 'news'); $('mapv').classList.toggle('hide', tab !== 'map');
  if (tab === 'map') { drawMap(); setTimeout(() => MAP.invalidateSize(), 80); }
  try { history.replaceState(null, '', '#' + tab); } catch {}
}
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  if (save) try { localStorage.setItem('vidraksh-theme', t); } catch {}
  $('themeSwitch').setAttribute('aria-checked', t === 'dark');
  $('themeWord').textContent = t === 'dark' ? 'Dark' : 'Light';
  $('themeColor').content = t === 'dark' ? '#131313' : '#E6E6E6';
  if (MAP) { setBase(); if (!$('mapv').classList.contains('hide')) drawMap(); }
}
$('themeSwitch').onclick = () => applyTheme(isDarkTheme() ? 'light' : 'dark', true);
applyTheme(document.documentElement.dataset.theme, false);
$('tabNews').onclick = () => show('news');
$('tabMap').onclick = () => show('map');
await load();
show(location.hash === '#map' ? 'map' : 'news');
</script>
</body>
</html>
