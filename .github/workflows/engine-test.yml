name: Engine test

# Runs the case engine on the stored reports (no fetching, no AI) on the engine-test branch, and saves the report
# as _test/result.txt on that branch. Nothing on the live site changes.
on:
  push:
    branches: [engine-test]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-minilm-l12-v2
      - run: pip install -q -r collector/requirements.txt
      - run: mkdir -p _test && (python -m py_compile collector/*.py && echo "compile ok" || echo "COMPILE FAILED") > _test/result.txt 2>&1 && DIAG="assault GRP constable|Attacked With Sickle at Pune Railway;;Narayangaon Art Center Firing|tamasha centre in Junnar" python collector/selftest.py >> _test/result.txt 2>&1 || true
      - run: (timeout 300 python collector/situations.py > _test/situations.txt 2>&1; echo "exit $?" >> _test/situations.txt; python -c "import json; [print(r['t'][:70], '|', r.get('S'), r.get('a'), r.get('w'), r.get('st'), r.get('en','')[:80]) for r in json.load(open('data/sitreports.json'))[:30]]" >> _test/situations.txt 2>&1) || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: (timeout 900 python collector/diag.py > _test/diag.txt 2>&1; echo "exit $?" >> _test/diag.txt) || true
      - run: (GEMINI_API_KEY= timeout 900 python collector/collect.py > _test/collect.txt 2>&1; echo "exit $?" >> _test/collect.txt) || true
      - run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -f _test/result.txt _test/collect.txt _test/situations.txt _test/diag.txt
          git commit -q -m "engine test result" && git push -q
