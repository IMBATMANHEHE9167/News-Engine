name: Scan clock

# GitHub's own timer ("schedule") often starts runs 20-60 minutes late or skips them. This clock keeps exact time
# instead: one run stays awake for ~5h45m and starts each scan on the minute (Situations at :00 :15 :30 :45,
# Reports at :17), then starts its own successor. The schedule below is only a backup that restarts the clock if
# it ever stops; a second clock always steps aside for the one already running.
on:
  workflow_dispatch:
  push:                       # also starts when this file changes
    branches: [main]
    paths: ['.github/workflows/clock.yml']
  schedule:
    - cron: '7,37 * * * *'

permissions:
  actions: write
  contents: read

jobs:
  clock:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Keep time
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ME: ${{ github.run_id }}
        run: |
          start() {  # start a workflow, retrying a few times if GitHub is busy
            for i in 1 2 3 4 5; do gh workflow run "$1" && { echo "$(date -u +%H:%M:%S) started $1"; return 0; }; sleep $((i * 5)); done
            echo "::warning::could not start $1"
          }
          # Let a predecessor that just handed over finish, then step aside if an older clock is still running.
          sleep 25
          older=$(gh run list -w clock.yml -s in_progress -L 20 --json databaseId -q ".[].databaseId" | awk -v me="$ME" '$1 < me' | wc -l)
          if [ "$older" -gt 0 ]; then echo "Another clock is already keeping time."; exit 0; fi

          end=$(( $(date +%s) + 345 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            now=$(date +%s); sleep $(( 60 - now % 60 ))       # wake at the start of each minute
            m=$(( 10#$(date -u +%M) ))
            [ $(( m % 15 )) -eq 0 ] && start situations.yml
            [ "$m" -eq 17 ] && start collect.yml
          done
          start clock.yml   # hand over to the next clock
