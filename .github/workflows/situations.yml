name: Scan Pune situations

on:
  # Started at :00 :15 :30 :45 by the scan clock (clock.yml); GitHub's own schedule skipped many runs.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/situations.py']

permissions:
  contents: write

concurrency:
  group: situations
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main when the job starts, not the commit that triggered it: a run that waited in the queue
                      # must not work on data older than the run before it (that erased AI readings on 2026-11-18)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/cache@v4          # the language model (~220 MB), shared with the hourly collector
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-minilm-l12-v2
      - run: pip install -q -r collector/requirements.txt || echo "machine reading libraries unavailable; continuing without them"
      - run: python collector/situations.py
      - name: Save situations
        run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          FILES="data/sitreports.json data/situations.json data/sitstatus.json"
          FILES=$(ls $FILES 2>/dev/null | xargs)   # only the files this run actually wrote
          BASE=$(git rev-parse HEAD)   # the main this run started from
          git add $FILES
          git diff --cached --quiet && exit 0
          git commit -q -m "situations: $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another workflow saved meanwhile, this run's files are put on top of the newest main (they are its own
          # files, so nothing else is touched). If a run of THIS workflow saved the same files after this run started,
          # this run's copy is dropped instead: replacing whole files would erase what that run added.
          for i in 1 2 3 4; do
            git push -q && exit 0
            mkdir -p /tmp/save && cp $FILES /tmp/save/
            git fetch -q origin main
            if ! git diff --quiet $BASE origin/main -- $FILES; then echo "::warning::A newer save of these files is on main; this run's copy is not saved (the next run redoes its work)."; exit 0; fi
            git reset -q --hard origin/main
            cp /tmp/save/* data/ && git add $FILES
            git diff --cached --quiet && exit 0
            git commit -q -m "situations: $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((i * 10))
          done
          exit 1
