name: Source value test

# Runs collector/diag2.py alone (a few minutes) on pushes to the diag2 branch and saves _test/diag2.txt there.
on:
  push:
    branches: [diag2]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: mkdir -p _test && (timeout 900 python collector/diag2.py > _test/diag2.txt 2>&1; echo "exit $?" >> _test/diag2.txt) || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -f _test/diag2.txt
          git commit -q -m "source value test result" && git push -q
