name: Build Pune place list

on:
  schedule:
    - cron: '40 2 3 * *'   # monthly: OpenStreetMap changes slowly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/gazetteer.py']

permissions:
  contents: write

concurrency:
  group: gazetteer        # its own queue; it only touches data/places.json, and rebases before pushing
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collector/gazetteer.py
      - name: Save place list
        run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          FILES="data/places.json"
          git add $FILES
          git diff --cached --quiet && exit 0
          git commit -q -m "places: $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another run saved meanwhile, this run's files replace its files whole (merging line by line could
          # break the JSON). Anything only that run had found is found again by the next hourly run.
          for i in 1 2 3 4; do
            git push -q && exit 0
            mkdir -p /tmp/save && cp $FILES /tmp/save/
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/save/. data/ && git add $FILES
            git diff --cached --quiet && exit 0
            git commit -q -m "places: $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((i * 10))
          done
          exit 1
