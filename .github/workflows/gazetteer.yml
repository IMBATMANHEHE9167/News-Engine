name: Build Pune place list

on:
  schedule:
    - cron: '40 2 3 * *'   # monthly: OpenStreetMap changes slowly
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/gazetteer.py']

permissions:
  contents: write

concurrency:
  group: gazetteer        # its own queue; it only touches data/places.json, and rebases before pushing
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the newest main when the job starts, not the commit that triggered it: a run that waited in the queue
                      # must not work on data older than the run before it (that erased AI readings on 2026-11-18)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cut OpenStreetMap down to named places in Pune district
        run: |
          sudo apt-get install -y -qq osmium-tool > /dev/null
          curl -sSL -o /tmp/west.osm.pbf https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
          osmium extract -b 73.30,17.85,75.25,19.40 /tmp/west.osm.pbf -o /tmp/pune.osm.pbf
          osmium tags-filter /tmp/pune.osm.pbf nwr/name -o /tmp/named.osm.pbf
          osmium export /tmp/named.osm.pbf -f geojsonseq -o /tmp/named.geojsonseq
      - run: python collector/gazetteer.py /tmp/named.geojsonseq
      - name: Save place list
        run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          FILES="data/places.json"
          FILES=$(ls $FILES 2>/dev/null | xargs)   # only the files this run actually wrote
          BASE=$(git rev-parse HEAD)   # the main this run started from
          git add $FILES
          git diff --cached --quiet && exit 0
          git commit -q -m "places: $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another workflow saved meanwhile, this run's files are put on top of the newest main (they are its own
          # files, so nothing else is touched). If a run of THIS workflow saved the same files after this run started,
          # this run's copy is dropped instead: replacing whole files would erase what that run added.
          for i in 1 2 3 4; do
            git push -q && exit 0
            mkdir -p /tmp/save && cp $FILES /tmp/save/
            git fetch -q origin main
            if ! git diff --quiet $BASE origin/main -- $FILES; then echo "::warning::A newer save of these files is on main; this run's copy is not saved (the next run redoes its work)."; exit 0; fi
            git reset -q --hard origin/main
            cp -r /tmp/save/. data/ && git add $FILES
            git diff --cached --quiet && exit 0
            git commit -q -m "places: $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((i * 10))
          done
          exit 1
