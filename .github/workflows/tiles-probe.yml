name: Map tiles probe

# Measures, without changing the site: (1) our own Pune map tiles built with Planetiler (OpenMapTiles schema, PMTiles):
# size and build time; (2) Google Open Buildings 2.5D heights (public GCS rasters) sampled on Overture footprints around
# Prabhat Road. Result in _test/tiles.txt on the tiles-probe branch.
on:
  push:
    branches: [tiles-probe]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Tools
        run: |
          sudo apt-get install -y -qq osmium-tool > /dev/null
          curl -sSL -o /tmp/planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          U=$(curl -s https://api.github.com/repos/protomaps/go-pmtiles/releases/latest | grep -o 'https://[^"]*Linux_x86_64.tar.gz' | head -1)
          curl -sSL "$U" | tar xz -C /tmp
          pip install -q overturemaps pyarrow shapely rasterio s2sphere numpy
          mkdir -p _test
      - name: Our own Pune tiles (Planetiler)
        if: ${{ false }}   # measured: 33 MB, 148 s for the district at z0-14
        run: |
          curl -sSL -o /tmp/west.osm.pbf https://download.geofabrik.de/asia/india/western-zone-latest.osm.pbf
          osmium extract -b 73.30,17.85,75.25,19.40 /tmp/west.osm.pbf -o /tmp/district.osm.pbf
          start=$(date +%s)
          java -Xmx5g -jar /tmp/planetiler.jar --osm-path=/tmp/district.osm.pbf --output=/tmp/district.pmtiles --download --force \
            --bounds=73.30,17.85,75.25,19.40 --maxzoom=14 > /tmp/pt.log 2>&1 || tail -20 /tmp/pt.log >> _test/tiles.txt
          echo "planetiler district z0-14: $(stat -c %s /tmp/district.pmtiles 2>/dev/null) bytes, $(( $(date +%s) - start )) s" >> _test/tiles.txt
          /tmp/pmtiles show /tmp/district.pmtiles 2>&1 | head -14 >> _test/tiles.txt || true
      - name: Google 2.5D heights on Overture footprints (Prabhat Road)
        run: |
          python - <<'EOF' >> _test/tiles.txt 2>&1
          import json, urllib.request, subprocess, numpy as np, s2sphere, rasterio, pyarrow.parquet as pq
          from rasterio.windows import from_bounds
          from shapely import wkb
          from shapely.geometry import box
          from rasterio.warp import transform_bounds
          lon, lat = 73.835, 18.513
          tok = s2sphere.CellId.from_lat_lng(s2sphere.LatLng.from_degrees(lat, lon)).parent(2).to_token()
          lst = json.load(urllib.request.urlopen('https://storage.googleapis.com/storage/v1/b/open-buildings-temporal-data/o?prefix=v1/manifests/%s_&maxResults=50' % tok))
          names = [o['name'] for o in lst.get('items', [])]
          print('S2 level-2 token %s: %d manifests, e.g. %s' % (tok, len(names), names[:3]))
          man = [n for n in names if '_2023_' in n and 'EPSG_32643' in n] or [n for n in names if '_2023_' in n]
          print('2023 manifests', man)
          m = json.load(urllib.request.urlopen('https://storage.googleapis.com/open-buildings-temporal-data/' + man[0]))
          ts = m['tilesets'][0]
          print('uriPrefix', m['uriPrefix'], 'first uri', ts['sources'][0]['uris'][0], 'affine', ts['sources'][0]['affineTransform'], 'dims', ts['sources'][0]['dimensions'])
          print('manifest keys', list(m.keys()), 'crs', ts.get('crs'), 'sources', len(ts['sources']), 'bands', [b.get('id') for b in m.get('bands', [])][:6])
          hit = None
          for s in ts['sources']:
              a, d = s['affineTransform'], s['dimensions']
              x0, y0 = a['translateX'], a['translateY']; x1 = x0 + a['scaleX'] * d['width']; y1 = y0 + a['scaleY'] * d['height']
              xb = transform_bounds(ts['crs'], 'EPSG:4326', min(x0, x1), min(y0, y1), max(x0, x1), max(y0, y1))
              if xb[0] <= lon <= xb[2] and xb[1] <= lat <= xb[3]:
                  hit = s; break
          if not hit:
              print('no tile covers Prabhat Road'); raise SystemExit
          url = 'https://storage.googleapis.com/open-buildings-temporal-data/' + m['uriPrefix'] + hit['uris'][0] if not m['uriPrefix'].startswith('gs://') else m['uriPrefix'].replace('gs://', 'https://storage.googleapis.com/') + hit['uris'][0]
          print('tile', url)
          subprocess.run(['curl', '-sSL', '-o', '/tmp/t.tif', url], check=True)
          subprocess.run(['overturemaps', 'download', '--bbox=73.825,18.505,73.845,18.522', '-f', 'geoparquet', '--type=building', '-o', '/tmp/pb.parquet'], check=True)
          t = pq.read_table('/tmp/pb.parquet')
          geoms = [wkb.loads(g) for g in t.column('geometry').to_pylist()]
          with rasterio.open('/tmp/t.tif') as r:
              print('raster', r.count, 'bands', r.dtypes, 'res', r.res, 'crs', r.crs, 'descriptions', r.descriptions, 'scales', r.scales)
              hb = 2 if r.count >= 2 else 1
              out = []
              for g in geoms:
                  b = transform_bounds('EPSG:4326', r.crs, *g.bounds)
                  w = from_bounds(*b, r.transform)
                  try:
                      arr = r.read(hb, window=w, boundless=True, fill_value=0).astype(float)
                  except Exception:
                      continue
                  v = arr[arr > 0]
                  if v.size:
                      out.append(float(np.percentile(v, 90)) * (r.scales[hb - 1] or 1))
              out.sort()
              print('Prabhat Road: %d footprints, %d with a 2.5D height; median %.1f m, 90th %.1f m, max %.1f m; over 20 m: %d, over 30 m: %d, over 45 m: %d' % (
                  len(geoms), len(out), out[len(out)//2] if out else 0, out[int(len(out)*.9)] if out else 0, out[-1] if out else 0,
                  sum(1 for x in out if x > 20), sum(1 for x in out if x > 30), sum(1 for x in out if x > 45)))
          EOF
      - name: Save
        run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -f _test/tiles.txt
          git commit -q -m "tiles probe result" && git push -q
