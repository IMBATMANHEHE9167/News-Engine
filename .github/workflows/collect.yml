name: Collect Pune incident news

on:
  # Started at :17 past every hour by the scan clock (clock.yml); GitHub's own schedule ran up to an hour late.
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['collector/**']   # re-run when the sorting rules change

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - uses: actions/cache@v4          # the language model (~220 MB), downloaded once and kept
        with:
          path: ~/.cache/fastembed
          key: fastembed-paraphrase-multilingual-minilm-l12-v2
      - run: pip install -q -r collector/requirements.txt || echo "machine reading libraries unavailable; continuing without them"
      - run: python collector/collect.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save new data
        run: |
          git config user.name "vidraksh-collector"
          git config user.email "actions@users.noreply.github.com"
          FILES="data/incidents.json data/rejected.json data/backfill.json data/status.json data/events.json data/meta.json data/review.json data/ocreports.json data/groups.json data/insights.json data/llmstate.json"
          FILES=$(ls $FILES 2>/dev/null | xargs)   # only the files this run actually wrote
          git add $FILES
          git diff --cached --quiet && exit 0
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another run saved meanwhile, this run's files replace its files whole (merging line by line could
          # break the JSON). Anything only that run had found is found again by the next hourly run.
          for i in 1 2 3 4; do
            git push -q && exit 0
            mkdir -p /tmp/save && cp $FILES /tmp/save/
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r /tmp/save/. data/ && git add $FILES
            git diff --cached --quiet && exit 0
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep $((i * 10))
          done
          exit 1
